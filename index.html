              await GoogleCalendar.call(userId, `/calendars/primary/events/${encodeURIComponent(gid)}`,
                { method: 'DELETE', query: { sendUpdates: CONFIG.GOOGLE_SEND_INVITES } });
            }
            done.push(gid);
          } catch (error) {
            if (error.status === 404 || error.status === 410) { done.push(gid); continue; } // already gone
            if (error.code === 'auth') { PendingDeletes.remove(userId, done); throw error; }
            // Any other failure: keep it and try again on the next sync.
          }
        }
        PendingDeletes.remove(userId, done);
      }

      let holidayCalendars = null; // { userId, ids, at }: the user's subscribed holiday calendars, looked up every 30 minutes
      async function holidayCalendarIds(userId) {
        if (holidayCalendars?.userId === userId && Date.now() - holidayCalendars.at < 30 * 60_000) return holidayCalendars.ids;
        const list = await GoogleCalendar.call(userId, '/users/me/calendarList', { query: { fields: 'items(id)', maxResults: '250' } });
        const ids = (list.items ?? []).map((c) => c.id).filter((id) => /#holiday@group\.v\.calendar\.google\.com$/.test(id));
        holidayCalendars = { userId, ids, at: Date.now() };
        return ids;
      }

      /** Download the events around the month being viewed and merge them in. */
      async function pullRemote(userId) {
        const first = DateUtils.firstOfMonth(getState().currentDate);
        const min = DateUtils.addMonthsClamped(first, -CONFIG.GOOGLE_SYNC_MONTHS_BEFORE);
        const max = DateUtils.addMonthsClamped(first, CONFIG.GOOGLE_SYNC_MONTHS_AFTER + 1);

        const items = [];
        let pageToken;
        do {
          const page = await GoogleCalendar.call(userId, '/calendars/primary/events', {
            query: {
              singleEvents: 'true',   // list each occurrence of a repeating event separately
              orderBy: 'startTime',
              showDeleted: 'false',
              supportsAttachments: 'true',
              timeMin: min.toISOString(),
              timeMax: max.toISOString(),
              maxResults: '2500',
              fields: 'nextPageToken,items(id,status,summary,description,location,hangoutLink,htmlLink,start,end,colorId,eventType,guestsCanModify,organizer(self),extendedProperties(private),attachments(fileId,fileUrl,title,mimeType,iconLink),attendees(email,responseStatus,self,resource,organizer))',
              ...(pageToken ? { pageToken } : {}),
            },
          });
          items.push(...(page.items ?? []));
          pageToken = page.nextPageToken;
        } while (pageToken && items.length < 10_000);

        // Holidays live in separate Google calendars. If they can't be loaded, keep the ones we already have.
        const holidayItems = [];
        let holidaysOk = true;
        try {
          for (const calendarId of await holidayCalendarIds(userId)) {
            const page = await GoogleCalendar.call(userId, `/calendars/${encodeURIComponent(calendarId)}/events`, {
              query: {
                singleEvents: 'true', showDeleted: 'false', timeMin: min.toISOString(), timeMax: max.toISOString(), maxResults: '2500',
                fields: 'items(id,status,summary,description,htmlLink,start,end,eventType)',
              },
            });
            holidayItems.push(...(page.items ?? []));
          }
        } catch { holidaysOk = false; }

        const state = getState();
        if (state.activeUserId !== userId) return; // the user switched accounts while we waited
        const validIds = new Set(Selectors.allCalendars(state).map((c) => c.id));
        const holidays = holidayItems.flatMap((item) => GoogleCalendar.fromEvent(item, validIds).map((e) => ({
          ...e, id: `h-${e.id}`, gid: `h-${e.id}`, holiday: true, readOnly: true, htmlLink: String(item.htmlLink ?? '').startsWith('https://') ? item.htmlLink : '', guests: [], attachments: [], link: '', gx: {},
          calendarId: validIds.has(HOLIDAYS_CALENDAR.id) ? HOLIDAYS_CALENDAR.id : e.calendarId,
        })));
        const remote = [...items.flatMap((item) => GoogleCalendar.fromEvent(item, validIds)), ...holidays];
        const range = { minKey: DateUtils.toKey(min), maxKey: DateUtils.toKey(max) };
        const tombstones = new Set(PendingDeletes.forUser(userId));
        covered = { userId, ...range };

        setState((s) => {
          if (s.activeUserId !== userId) return {};
          const nonTasks = s.events.filter((e) => !isTaskEvent(e)); // Google Tasks are merged separately
          const base = holidaysOk ? nonTasks : nonTasks.filter((e) => !e.holiday);
          const kept = holidaysOk ? [] : nonTasks.filter((e) => e.holiday);
          const merged = reconcileGoogleEvents(base, remote, { ...range, tombstones });
          return merged === base ? {} : { events: [...merged, ...kept, ...s.events.filter(isTaskEvent)] };
        });
      }

      /** Download every Google task (including completed ones) and merge it in. */
      async function pullTasks(userId) {
        const items = [];
        let pageToken;
        do {
          const page = await GoogleTasks.call(userId, GoogleTasks.LIST, {
            query: {
              showCompleted: 'true', showHidden: 'true', maxResults: '100',
              fields: 'nextPageToken,items(id,title,notes,due,status,completed)',
              ...(pageToken ? { pageToken } : {}),
            },
          });
          items.push(...(page.items ?? []));
          pageToken = page.nextPageToken;
        } while (pageToken && items.length < 5000);

        const state = getState();
        if (state.activeUserId !== userId) return;
        const remote = items.map(GoogleTasks.fromTask);
        const tombstones = new Set(PendingDeletes.forUser(userId));
        const calendars = Selectors.allCalendars(state);
        const defaultCalendarId = calendars.find((c) => c.id === 'personal')?.id ?? calendars[0]?.id ?? 'personal';
        setState((s) => {
          if (s.activeUserId !== userId) return {};
          const mine = s.events.filter(isTaskEvent);
          const merged = reconcileGoogleTasks(mine, remote, { tombstones, defaultCalendarId });
          return merged === mine ? {} : { events: [...s.events.filter((e) => !isTaskEvent(e)), ...merged] };
        });
      }

      function fail(userId, error, silent) {
        if (getState().activeUserId !== userId) return;
        if (error.code === 'auth') {
          GoogleCalendarAuth.forget(userId);
          setStatus({ status: 'off', message: 'Google Calendar disconnected. Reconnect to keep syncing.' });
        } else {
          setStatus({ status: 'error', message: explainGoogleError(error) });
        }
        if (!silent) toast(getState().gcal.message);
      }

      async function runSync(userId, { silent }) {
        if (getState().activeUserId !== userId) return;
        running = true;
        try {
          if (!silent) setStatus({ status: 'syncing', message: '' });
          await flushDeletes(userId);
          const pushFailure = await pushPending(userId);
          await pullRemote(userId);
          await pullTasks(userId);
          if (pushFailure) throw pushFailure;
          if (getState().activeUserId === userId) setStatus({ status: 'synced', message: '', lastSync: Date.now() });
          if (!silent) toast('Google Calendar is up to date');
        } catch (error) {
          fail(userId, error, silent);
        } finally {
          running = false;
          lastRunAt = Date.now();
        }
      }

      /** Push pending changes, then pull. `silent` = background poll (no spinner, no toast). */
      async function syncNow({ silent = false, force = false, gesture = false } = {}) {
        const user = currentUser();
        if (!user) return;
        if (!GoogleCalendarAuth.tokenFor(user.id)) {
          // No token (fresh page load, or it expired): try to get a new one without any popup first.
          // Everything up to requestAccessToken must stay synchronous, or browsers block the popup.
          if (!(await refreshToken(user, { gesture }))) {
            if (getState().gcal.status !== 'off') {
              setStatus({ status: 'off', message: 'Google Calendar session expired. Reconnect to keep syncing.' });
            }
            return;
          }
        }
        if (silent && !force && (running || Date.now() - lastRunAt < 5_000)) return;
        return enqueue(() => runSync(user.id, { silent }));
      }

      let refreshing = null;
      let refreshFailedAt = 0;
      /** Quietly get a new token. Failures are remembered for a few minutes so the timer doesn't keep retrying. */
      function refreshToken(user, { gesture = false } = {}) {
        if (refreshing) return refreshing;
        if (!GoogleCalendar.eligible(user) || !GoogleAuth.isLoaded()) return Promise.resolve(false);
        if (Date.now() - refreshFailedAt < (gesture ? 60_000 : 5 * 60_000)) return Promise.resolve(false);
        refreshing = GoogleCalendarAuth.request(user, { silent: true }).then(
          () => true,
          () => { refreshFailedAt = Date.now(); return false; },
        ).finally(() => { refreshing = null; });
        return refreshing;
      }

      /** Open Google's permission popup (must run straight from a click), then sync. */
      async function connect() {
        const user = currentUser();
        if (!user) return;
        if (!GoogleAuth.isLoaded()) return toast('Google is still loading. Check your connection and try again.');
        setStatus({ status: 'syncing', message: '' });
        try {
          await GoogleCalendarAuth.request(user);
        } catch (error) {
          setStatus({ status: 'off', message: error.cancelled ? '' : error.message });
          if (!error.cancelled) toast(error.message);
          return;
        }
        await syncNow();
      }

      function disconnect() {
        const user = currentUser();
        if (!user) return;
        const token = GoogleCalendarAuth.tokenFor(user.id);
        GoogleCalendarAuth.forget(user.id);
        if (token && GoogleAuth.isLoaded()) google.accounts.oauth2.revoke(token, () => {});
        setStatus({ status: 'off', message: '', lastSync: null });
        toast('Disconnected from Google Calendar');
      }

      /** Called right after a schedule is saved. */
      function pushSoon(eventId, { quiet = false } = {}) {
        const user = currentUser();
        if (!user || !GoogleCalendarAuth.tokenFor(user.id)) return; // not connected: it goes up when they connect
        enqueue(async () => {
          const event = getState().events.find((e) => e.id === eventId);
          if (!event || !needsSending(event)) return; // a sync already sent it
          try {
            markSent(event.id, await pushOne(user.id, event), event.rev);
            if (!quiet) toast(isTaskEvent(event) ? 'Saved to Google Tasks' : 'Saved to Google Calendar');
          } catch (error) {
            fail(user.id, error, true);
            toast('Saved here, but not sent to Google Calendar yet. Taskly will retry.');
          }
        });
      }

      /** Called right after a schedule is deleted. */
      function removeSoon(event) {
        const user = currentUser();
        const gid = isTaskEvent(event)
          ? (event.gid ? `task:${event.gid}` : null) // a task that never reached Google has nothing to delete there
          : (event.gid ?? GoogleCalendar.idFor(event.id));
        if (!user || !gid) return;
        PendingDeletes.add(user.id, gid);
        if (!GoogleCalendarAuth.tokenFor(user.id)) return; // it is removed the next time they connect
        enqueue(async () => {
          try {
            await flushDeletes(user.id);
            toast(PendingDeletes.forUser(user.id).includes(gid)
              ? 'Deleted here. Google Calendar will catch up on the next sync.'
              : 'Removed from Google Calendar');
          } catch (error) {
            fail(user.id, error, true);
          }
        });
      }

      /** Load more events when the user navigates beyond the months we already have. */
      function ensureCoverage() {
        const user = currentUser();
        if (!user || !GoogleCalendarAuth.tokenFor(user.id) || coverageQueued) return;
        const gridStart = DateUtils.startOfWeek(DateUtils.firstOfMonth(getState().currentDate));
        const from = DateUtils.toKey(gridStart);
        const to = DateUtils.toKey(DateUtils.addDays(gridStart, 42));
        if (covered && covered.userId === user.id && from >= covered.minKey && to <= covered.maxKey) return;
        coverageQueued = true;
        enqueue(async () => {
          coverageQueued = false;
          await runSync(user.id, { silent: true });
        });
      }

      /** The active account changed: start fresh and, if we hold a token for it, sync. */
      function accountChanged() {
        covered = null;
        const user = currentUser();
        const connected = Boolean(user && GoogleCalendarAuth.tokenFor(user.id));
        setStatus({ status: connected ? 'syncing' : 'off', message: '', lastSync: null });
        if (connected) syncNow({ silent: true, force: true });
      }

      /** Start the background triggers. Called once at launch. */
      function start() {
        const poll = () => { if (document.visibilityState === 'visible') syncNow({ silent: true }); };
        setInterval(poll, CONFIG.GOOGLE_SYNC_INTERVAL_MS);
        document.addEventListener('visibilitychange', poll);
        window.addEventListener('focus', poll);

        // Sync at launch, once Google's script has loaded.
        let tries = 0;
        const kickoff = () => {
          if (GoogleAuth.isLoaded()) syncNow({ silent: true, force: true });
          else if (tries++ < 25) setTimeout(kickoff, 200);
        };
        kickoff();
        // Browsers often refuse a popup-less token request that isn't tied to a click, so retry on the
        // first click that isn't on a control (controls like "Connect" open their own popup).
        document.addEventListener('pointerdown', (e) => {
          const user = currentUser();
          if (!user || e.target.closest?.('button, a, input, [role="button"]') || GoogleCalendarAuth.tokenFor(user.id)) return;
          syncNow({ silent: true, force: true, gesture: true });
        });

        let lastKey = '';
        store.subscribe((state) => {
          const key = `${state.activeUserId}|${DateUtils.toKey(state.currentDate)}`;
          if (key === lastKey) return;
          lastKey = key;
          ensureCoverage();
        });
      }

      return { start, syncNow, connect, disconnect, pushSoon, removeSoon, accountChanged };
    }

    function createActions(store) {
      const { getState, setState } = store;
      let toastCounter = 0;
      let toastTimer = null;
      const calendarSync = createCalendarSync({ store, toast: (message) => actions.showToast(message) });
      const activeGoogleUser = () => googleUserOf(getState());

      const actions = {
        /* Navigation */
        navigate: (route) => setState({ activeRoute: route }),
        setView: (view) => setState({ view }),
        selectDate: (date) => setState({
          currentDate: DateUtils.startOfDay(date),
          miniMonth: DateUtils.firstOfMonth(date),
        }),
        showDay(date) {
          setState({
            view: 'day',
            currentDate: DateUtils.startOfDay(date),
            miniMonth: DateUtils.firstOfMonth(date),
          });
        },
        goToToday: () => actions.selectDate(new Date()),
        shift(direction) {
          const { view, currentDate } = getState();
          actions.selectDate(CalendarViews[view].shift(currentDate, direction));
        },
        shiftMiniMonth: (direction) =>
          setState((s) => ({ miniMonth: DateUtils.addMonthsClamped(s.miniMonth, direction) })),

        /* Sidebar */
        toggleAccount: (accountId) => setState((s) => ({
          accounts: s.accounts.map((a) => a.id === accountId ? { ...a, expanded: !a.expanded } : a),
        })),
        toggleCalendar: (accountId, calendarId) => setState((s) => ({
          accounts: s.accounts.map((a) => a.id !== accountId ? a : {
            ...a,
            calendars: a.calendars.map((c) => c.id === calendarId ? { ...c, visible: !c.visible } : c),
          }),
        })),

        /* Schedule modal */
        openNewSchedule({ date, start } = {}) {
          const state = getState();
          const fallback = closestHalfHourRange(state.now);
          const startMinutes = start ?? fallback.start;
          setState({
            modal: {
              mode: 'create',
              event: {
                id: null,
                title: '',
                date: date ?? DateUtils.toKey(state.currentDate),
                start: startMinutes,
                end: Math.min(startMinutes + 60, 24 * 60),
                allDay: false,
                description: '',
                calendarId: Selectors.allCalendars(state)[0]?.id ?? '',
                guests: [],
                attachments: [],
                link: '',
              },
            },
          });
        },
        openEditSchedule: (event) => setState({ modal: { mode: 'edit', event } }),
        closeModal: () => setState({ modal: null }),

        saveEvent(data) {
          const mirrors = Boolean(activeGoogleUser()); // is there a Google calendar to keep in step?
          let savedId = data.id;
          setState((s) => {
            const existing = data.id ? s.events.find((e) => e.id === data.id) : undefined;
            const id = existing?.id ?? createId();
            savedId = id;
            // `dirty` = changed here but not yet sent to Google (the sync engine clears it).
            // `rev` lets the engine tell whether it was edited again while a request was in flight.
            const saved = existing
              ? { ...existing, ...data, id, dirty: mirrors || Boolean(existing.dirty), rev: (existing.rev ?? 0) + 1 }
              : { ...data, id, gid: null, gtype: 'task', onGoogle: false, dirty: mirrors, rev: 1 }; // new items become Google Tasks
            const events = existing ? s.events.map((e) => (e.id === id ? saved : e)) : [...s.events, saved];
            const savedDate = DateUtils.fromKey(data.date);
            return { events, modal: null, currentDate: savedDate, miniMonth: DateUtils.firstOfMonth(savedDate) };
          });
          actions.showToast('Task saved');
          if (mirrors) calendarSync.pushSoon(savedId);
        },
        /** Tick a task off (or back on) from the to-do list. Google Tasks get the change too; older calendar events stay local. */
        toggleTaskDone(eventId) {
          const mirrors = Boolean(activeGoogleUser());
          let push = false;
          setState((s) => ({
            events: s.events.map((e) => {
              if (e.id !== eventId) return e;
              const done = !e.completed;
              const updated = { ...e, completed: done, completedAt: done ? Date.now() : null };
              if (mirrors && e.gtype === 'task') { push = true; return { ...updated, dirty: true, rev: (e.rev ?? 0) + 1 }; }
              return updated;
            }),
          }));
          if (push) calendarSync.pushSoon(eventId, { quiet: true });
        },
        deleteEvent(eventId) {
          const target = getState().events.find((e) => e.id === eventId);
          setState((s) => ({ events: s.events.filter((e) => e.id !== eventId), modal: null }));
          actions.showToast('Task deleted');
          if (target && activeGoogleUser()) calendarSync.removeSoon(target);
        },

        /* Authentication */
        openLogin: (mode = 'signin') =>
          setState({ loginModal: { mode }, accountMenu: null, authError: '', authLoading: false }),
        closeLogin: () => setState({ loginModal: null, authLoading: false, authError: '' }),
        openAccountMenu: (position) => setState({ accountMenu: position }),
        closeAccountMenu: () => setState({ accountMenu: null }),

        async signInWithGoogle() {
          if (!GoogleAuth.isConfigured()) {
            return setState({ authError: 'Google sign-in needs a client ID. Add yours to CONFIG.GOOGLE_CLIENT_ID.' });
          }
          if (!GoogleAuth.isLoaded()) {
            return setState({ authError: 'Google sign-in is still loading. Check your connection and try again.' });
          }
          setState({ authLoading: true, authError: '' });
          try {
            // requestProfile() runs synchronously up to the popup, so browsers
            // treat it as a direct result of the click and don't block it.
            const { profile, grant } = await GoogleAuth.requestProfile();
            actions.completeSignIn(profile, grant);
          } catch (error) {
            setState({ authLoading: false, authError: error.cancelled ? '' : error.message });
          }
        },

        /** For trying the UI without a Google client ID. */
        signInDemo() {
          const number = getState().users.filter((u) => u.demo).length + 1;
          actions.completeSignIn({
            id: `demo-${createId()}`, name: `Demo user ${number}`,
            email: `demo${number}@example.com`, picture: '', demo: true,
          });
        },

        completeSignIn(profile, grant) {
          const wasKnown = getState().users.some((u) => u.id === profile.id);
          setState((s) => {
            const users = wasKnown
              ? s.users.map((u) => (u.id === profile.id ? { ...u, ...profile } : u))
              : [...s.users, profile];
            return { ...buildSwitchPatch(s, users, profile.id), loginModal: null, authLoading: false, authError: '', accountMenu: null };
          });
          actions.showToast(wasKnown ? `Switched to ${profile.email}` : `Signed in as ${profile.email}`);
          // The sign-in token already includes calendar access, so sync straight away.
          if (grant?.calendar) GoogleCalendarAuth.remember(profile.id, grant.accessToken, grant.expiresIn);
          calendarSync.accountChanged();
        },

        switchAccount(userId) {
          const user = getState().users.find((u) => u.id === userId);
          if (!user) return;
          setState((s) => ({ ...buildSwitchPatch(s, s.users, userId), accountMenu: null }));
          actions.showToast(`Switched to ${user.email}`);
          calendarSync.accountChanged();
        },

        /** The quick-switch button: jump to the next signed-in account. */
        cycleAccount() {
          const { users, activeUserId } = getState();
          if (users.length < 2) return;
          const index = users.findIndex((u) => u.id === activeUserId);
          actions.switchAccount(users[(index + 1) % users.length].id);
        },

        signOut(userId) {
          const email = getState().users.find((u) => u.id === userId)?.email;
          const wasActive = getState().activeUserId === userId;
          GoogleCalendarAuth.forget(userId);
          PendingDeletes.clear(userId);
          setState((s) => {
            const users = s.users.filter((u) => u.id !== userId);
            const nextActive = s.activeUserId === userId ? (users[0]?.id ?? null) : s.activeUserId;
            const patch = buildSwitchPatch(s, users, nextActive);
            const { [userId]: _discarded, ...workspaces } = patch.workspaces; // drop their cached data
            return { ...patch, workspaces, accountMenu: null };
          });
          actions.showToast(email ? `Signed out of ${email}` : 'Signed out');
          if (wasActive) calendarSync.accountChanged();
        },

        /* Google Calendar */
        connectGoogle: () => calendarSync.connect(),        // must run straight from a click (opens a popup)
        disconnectGoogle: () => calendarSync.disconnect(),
        syncGoogle: () => calendarSync.syncNow(),
        /** The header button: sync when connected, otherwise start the connection. */
        syncOrConnectGoogle() {
          const user = activeGoogleUser();
          if (!user) return undefined;
          return GoogleCalendarAuth.tokenFor(user.id) ? calendarSync.syncNow() : calendarSync.connect();
        },
        startGoogleSync: () => calendarSync.start(),
        /** Open Google Calendar events in Taskly's modal instead of redirecting externally. */
        openInGoogle(event) {
          // Open inside Taskly's schedule modal
          actions.openEditSchedule(event);
        },

        /* Feedback + time */
        showToast(message) {
          const id = ++toastCounter;
          setState({ toast: { id, message } });
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            setState((s) => (s.toast?.id === id ? { toast: null } : {}));
          }, CONFIG.TOAST_DURATION_MS);
        },
        tick: () => setState({ now: new Date() }),
      };
      return actions;
    }

    /* ================================================================
       6. MODULE REGISTRY
       ================================================================
       A module is a plain object (see the how-to at the top). The
       registry handles the boring plumbing so modules stay small:

         - finds (or creates) the slot element
         - calls `bind` ONCE   -> attach listeners with event delegation
         - subscribes to the store and calls `render` when `deps` change
         - shows/hides page modules that have a `route`

       EVENT DELEGATION: we attach one listener to the slot and inspect
       `event.target.closest('[data-...]')`. Because the slot element
       itself is never replaced (only its innerHTML), listeners survive
       every re-render. Attaching listeners to child elements would leak
       or break each time the HTML is rebuilt.
    */
    const ModuleRegistry = {
      modules: [],

      register(...modules) {
        modules.forEach((mod) => {
          if (!mod.id || !mod.slot) throw new Error('A module needs an `id` and a `slot`.');
          if (this.modules.some((m) => m.id === mod.id)) throw new Error(`Duplicate module id: ${mod.id}`);
          this.modules.push(mod);
        });
        return this;
      },

      mountAll(ctx) {
        this.modules.forEach((mod) => this.mount(mod, ctx));
      },

      mount(mod, ctx) {
        let el = document.querySelector(mod.slot);

        // Modules can create their own slot (used by page modules).
        if (!el && mod.createIn) {
          el = document.createElement(mod.tag ?? 'section');
          el.id = mod.slot.replace(/^#/, '');
          el.className = mod.slotClass ?? '';
          document.querySelector(mod.createIn)?.appendChild(el);
        }
        if (!el) { console.warn(`[registry] Slot not found for "${mod.id}": ${mod.slot}`); return; }

        let previousDeps = null;

        const update = (state) => {
          // `hidden` comes last in Tailwind's display utilities, so it wins over `flex`.
          if (mod.route) el.classList.toggle('hidden', state.activeRoute !== mod.route);
          if (!mod.render) return;

          // Skip the render if none of the dependencies changed.
          const deps = mod.deps ? mod.deps(state) : [state];
          const unchanged = previousDeps
            && deps.length === previousDeps.length
            && deps.every((dep, i) => Object.is(dep, previousDeps[i]));
          if (unchanged) return;
          previousDeps = deps;

          el.innerHTML = mod.render(state, ctx);
          mod.afterRender?.(el, state, ctx);
        };

        mod.bind?.(el, ctx);
        ctx.store.subscribe(update);
        update(ctx.store.getState());
      },
    };

    /* ================================================================
       7. MODULES
       ================================================================ */

    /* ---------- 7.1 Navigation rail ---------- */
    const NAV_ITEMS = [
      { route: 'home',     label: 'Home',     icon: 'home' },
      { route: 'calendar', label: 'Calendar', icon: 'calendar' },
      { route: 'tasks',    label: 'Tasks',    icon: 'tasks' },
      { route: 'timer',    label: 'Timer',    icon: 'timer' },
      { route: 'settings', label: 'Settings', icon: 'settings' },
    ];

    const RailModule = {
      id: 'rail',
      slot: '#slot-rail',
      deps: (s) => [s.activeRoute, s.users, s.activeUserId],
      render(state) {
        const buttonBase = 'flex h-10 w-10 items-center justify-center rounded-full transition-colors';
        const navButtons = NAV_ITEMS.map((item) => {
          const active = item.route === state.activeRoute;
          const tone = active ? 'bg-white text-black' : 'bg-surface-raised text-ink-muted hover:text-ink';
          return `
            <button type="button" data-route="${item.route}" title="${item.label}" aria-label="${item.label}"
                    ${active ? 'aria-current="page"' : ''} class="${buttonBase} ${tone}">
              ${icon(item.icon)}
            </button>`;
        }).join('');

        return `
          <img src="logo.png" alt="Taskly" width="44" height="44" class="h-11 w-11 shrink-0 select-none object-contain" draggable="false" />
          <button type="button" data-open-account data-account-anchor aria-haspopup="menu"
                  aria-label="${state.activeUserId ? 'Account menu' : 'Sign in'}" title="${state.activeUserId ? 'Account' : 'Sign in'}"
                  class="shrink-0 rounded-full lg:hidden">
            ${renderAvatar(Selectors.activeUser(state))}
          </button>
          <div class="flex flex-row gap-2 md:flex-1 md:flex-col md:justify-center">${navButtons}</div>
          <div class="ml-auto flex flex-row gap-2 md:ml-0 md:flex-col">
            <button type="button" data-action="help" title="Help" aria-label="Help" class="${buttonBase} bg-surface-raised text-ink-muted hover:text-ink">${icon('help')}</button>
            <button type="button" data-action="logout" title="Log out" aria-label="Log out" class="${buttonBase} bg-surface-raised text-ink-muted hover:text-ink">${icon('logout')}</button>
          </div>`;
      },
      bind(el, ctx) {
        const { actions } = ctx;
        el.addEventListener('click', (e) => {
          if (handleAccountTrigger(e.target, ctx)) return;
          const routeButton = e.target.closest('[data-route]');
          if (routeButton) return actions.navigate(routeButton.dataset.route);

          const actionButton = e.target.closest('[data-action]');
          if (actionButton?.dataset.action === 'help') actions.showToast('Connect your help centre here.');
          if (actionButton?.dataset.action === 'logout') actions.showToast('Connect your sign-out flow here.');
        });
      },
    };

    /* ---------- 7.2 Account UI ----------
       Three cooperating pieces share one slice of state:
         a) WorkspaceModule   the "Taskly" card (sign-in button / account menu trigger)
         b) AccountMenuModule the popup with switch / add / sign out
         c) AuthModalModule   the blurred Google sign-in popup
    */

    const getInitials = (user) =>
      (user.name || user.email).trim().split(/\s+/).slice(0, 2).map((part) => part[0]).join('').toUpperCase();

    /** Profile photo if we have one, otherwise initials, otherwise a generic user icon. */
    function renderAvatar(user, size = 'h-10 w-10') {
      if (!user) {
        return `<span class="flex ${size} shrink-0 items-center justify-center rounded-full bg-surface-raised text-ink-muted" aria-hidden="true">${icon('user')}</span>`;
      }
      if (user.picture) {
        return `<img src="${esc(user.picture)}" alt="" referrerpolicy="no-referrer" class="${size} shrink-0 rounded-full object-cover" />`;
      }
      return `<span class="flex ${size} shrink-0 items-center justify-center rounded-full bg-accent text-sm font-bold text-black" aria-hidden="true">${esc(getInitials(user))}</span>`;
    }

    /**
     * Shared click logic for anything that opens the account flow (the sidebar card
     * AND the rail avatar, which is the only entry point on small screens).
     * Returns true when the click was handled.
     */
    function handleAccountTrigger(target, { store, actions }) {
      const trigger = target.closest('[data-open-account]');
      if (!trigger) return false;

      const state = store.getState();
      if (!state.users.length) { actions.openLogin('signin'); return true; }
      if (state.accountMenu) { actions.closeAccountMenu(); return true; }

      // Position the popup under the element that was clicked, kept inside the viewport.
      const anchor = trigger.closest('[data-account-anchor]') ?? trigger;
      const rect = anchor.getBoundingClientRect();
      const width = Math.min(CONFIG.ACCOUNT_MENU_WIDTH, window.innerWidth - 24);
      const left = Math.max(12, Math.min(rect.left, window.innerWidth - width - 12));
      actions.openAccountMenu({ top: rect.bottom + 8, left, width });
      return true;
    }

    const LOGO_BOX = `
      <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-white" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="#111" stroke-width="2.5"><path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z"/><circle cx="12" cy="12" r="2.5" fill="#111"/></svg>
      </span>`;

    const GOOGLE_LOGO = `
      <svg viewBox="0 0 48 48" class="h-5 w-5" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>`;

    /* a) The "Taskly" card */
    const WorkspaceModule = {
      id: 'workspace',
      slot: '#slot-workspace',
      deps: (s) => [s.users, s.activeUserId, s.accountMenu],
      render(state) {
        const user = Selectors.activeUser(state);

        // Signed out: the whole card is a sign-in button.
        if (!user) {
          return `
            <button type="button" data-open-account data-account-anchor
                    class="flex w-full items-center gap-3 rounded-2xl bg-surface p-4 text-left transition-colors hover:bg-surface-raised">
              <span class="min-w-0 flex-1">
                <span class="block truncate text-base font-medium">Taskly</span>
                <span class="block truncate text-sm text-ink-muted">Sign in with Google</span>
              </span>
              <span class="text-ink-muted">${icon('login', 'h-4 w-4')}</span>
            </button>`;
        }

        // Signed in: opens the account menu. With 2+ accounts a quick-switch button appears on the right.
        const firstName = (user.name || user.email).split(' ')[0];
        const next = state.users[(state.users.findIndex((u) => u.id === user.id) + 1) % state.users.length];
        const switchButton = state.users.length > 1 ? `
          <button type="button" data-cycle-account aria-label="Switch to ${esc(next.email)}" title="Switch to ${esc(next.email)}"
                  class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-line bg-surface-raised text-ink-muted transition-colors hover:text-ink">
            ${icon('swap', 'h-4 w-4')}
          </button>` : '';

        return `
          <div data-account-anchor class="flex items-center gap-2 rounded-2xl bg-surface p-4">
            <button type="button" data-open-account aria-haspopup="menu" aria-expanded="${Boolean(state.accountMenu)}"
                    class="flex min-w-0 flex-1 items-center gap-3 text-left">
              ${renderAvatar(user, 'h-10 w-10')}
              <span class="min-w-0 flex-1">
                <span class="block truncate text-base font-medium">Taskly</span>
                <span class="block truncate text-sm text-ink-muted">${esc(firstName)}'s workspace</span>
              </span>
              <span class="text-ink-muted">${icon('chevronsUpDown', 'h-4 w-4')}</span>
            </button>
            ${switchButton}
          </div>`;
      },
      bind(el, ctx) {
        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-cycle-account]')) return ctx.actions.cycleAccount();
          handleAccountTrigger(e.target, ctx);
        });
      },
    };

    /* b) The account popup (switch / add / sign out) */
    const AccountMenuModule = {
      id: 'account-menu',
      slot: '#slot-account-menu',
      deps: (s) => [s.accountMenu, s.users, s.activeUserId],
      render(state) {
        if (!state.accountMenu) return '';
        const { top, left, width } = state.accountMenu;
        const active = Selectors.activeUser(state);
        if (!active) return '';
        const multiple = state.users.length > 1;

        const rowBase = 'flex w-full items-center gap-3 rounded-xl px-2 py-2 text-left';
        const identity = (user) => `
          ${renderAvatar(user, 'h-9 w-9')}
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-medium">${esc(user.name || user.email)}</span>
            <span class="block truncate text-xs text-ink-muted">${esc(user.email)}</span>
          </span>`;

        // 2+ accounts: a list to switch between. 1 account: just show who is signed in.
        const accountSection = multiple ? `
          <p class="px-2 pb-1 pt-1 text-xs text-ink-muted">Switch account</p>
          <ul class="flex flex-col gap-0.5">
            ${state.users.map((user) => {
              const isActive = user.id === active.id;
              return `
                <li>
                  <button type="button" role="menuitemradio" aria-checked="${isActive}" data-switch-user="${esc(user.id)}"
                          class="${rowBase} transition-colors ${isActive ? 'bg-white/[0.07]' : 'hover:bg-white/5'}">
                    ${identity(user)}
                    ${isActive ? `<span class="text-accent">${icon('check', 'h-4 w-4')}</span>` : ''}
                  </button>
                </li>`;
            }).join('')}
          </ul>` : `<div class="${rowBase}">${identity(active)}</div>`;

        const actionIcon = (name) => `<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-surface-raised text-ink-muted">${icon(name, 'h-4 w-4')}</span>`;

        return `
          <div data-menu-backdrop class="fixed inset-0 z-40"></div>
          <div role="menu" aria-label="Account menu"
               class="fixed z-50 rounded-2xl border border-line bg-surface p-2 shadow-2xl"
               style="top:${top}px;left:${left}px;width:${width}px">
            ${accountSection}
            <div class="my-2 border-t border-line"></div>
            <button type="button" role="menuitem" data-add-account class="${rowBase} text-sm transition-colors hover:bg-white/5">
              ${actionIcon('plus')} Add account
            </button>
            <button type="button" role="menuitem" data-sign-out="${esc(active.id)}" class="${rowBase} text-sm transition-colors hover:bg-white/5">
              ${actionIcon('logout')} <span class="min-w-0 flex-1 truncate">Sign out</span>
            </button>
          </div>`;
      },
      afterRender(el) {
        // Move keyboard focus into the popup so arrow/Tab users land in it.
        el.querySelector('[role="menu"] button')?.focus();
      },
      bind(el, { actions }) {
        el.addEventListener('click', (e) => {
          if (e.target.matches('[data-menu-backdrop]')) return actions.closeAccountMenu();

          const switchButton = e.target.closest('[data-switch-user]');
          if (switchButton) return actions.switchAccount(switchButton.dataset.switchUser);

          if (e.target.closest('[data-add-account]')) return actions.openLogin('add');

          const signOutButton = e.target.closest('[data-sign-out]');
          if (signOutButton) actions.signOut(signOutButton.dataset.signOut);
        });
      },
    };

    /* c) The sign-in popup: same card style as the schedule modal, with a blurred backdrop */
    const AuthModalModule = {
      id: 'auth-modal',
      slot: '#slot-auth-modal',
      deps: (s) => [s.loginModal, s.authLoading, s.authError],
      render(state) {
        if (!state.loginModal) return '';
        const isAdd = state.loginModal.mode === 'add';
        const configured = GoogleAuth.isConfigured();

        const demoSection = configured ? '' : `
          <div class="mt-5 rounded-xl border border-dashed border-line p-4 text-xs leading-relaxed text-ink-muted">
            Google sign-in isn't set up yet. Add your OAuth client ID to
            <code class="text-ink">CONFIG.GOOGLE_CLIENT_ID</code>, or try the app with a demo account.
          </div>
          <button type="button" data-demo-signin
                  class="mt-3 w-full rounded-xl border border-line px-5 py-3 text-sm transition-colors hover:bg-white/5">
            Continue in demo mode
          </button>`;

        return `
          <div data-auth-overlay class="fixed inset-0 z-[55] flex items-center justify-center overflow-y-auto bg-black/60 p-4 backdrop-blur-md">
            <div role="dialog" aria-modal="true" aria-labelledby="auth-heading"
                 class="relative my-auto w-full max-w-sm rounded-3xl border border-line bg-surface p-6 shadow-2xl">
              <button type="button" data-close-auth aria-label="Close"
                      class="absolute right-5 top-5 rounded-full p-1 text-ink-muted hover:text-ink">${icon('close')}</button>
              <h2 id="auth-heading" class="mt-5 text-3xl">${isAdd ? 'Add account' : 'Sign in'}</h2>
              <p class="mt-2 text-sm text-ink-muted">
                ${isAdd
                  ? 'Choose another Google account. You can switch between your accounts at any time.'
                  : 'Continue with your Google account to open your calendar workspace and sync it with Google Calendar.'}
              </p>

              <button type="button" data-google-signin ${state.authLoading ? 'disabled' : ''}
                      class="mt-6 flex w-full items-center justify-center gap-3 rounded-xl bg-white px-5 py-3 text-sm font-medium text-black transition-colors hover:bg-white/90 disabled:opacity-60">
                ${GOOGLE_LOGO}
                ${state.authLoading ? 'Waiting for Google…' : 'Continue with Google'}
              </button>

              <p role="alert" class="mt-3 min-h-5 text-sm text-red-400">${esc(state.authError)}</p>
              ${demoSection}
            </div>
          </div>`;
      },
      afterRender(el) {
        el.querySelector('[data-google-signin]')?.focus();
      },
      bind(el, { actions }) {
        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-close-auth]') || e.target.matches('[data-auth-overlay]')) return actions.closeLogin();
          if (e.target.closest('[data-google-signin]')) return actions.signInWithGoogle();
          if (e.target.closest('[data-demo-signin]')) actions.signInDemo();
        });
      },
    };

    /* ---------- 7.3 Mini calendar ---------- */
    const MiniCalendarModule = {
      id: 'mini-calendar',
      slot: '#slot-mini-calendar',
      deps: (s) => [s.miniMonth, s.currentDate, s.now],
      render(state) {
        const gridStart = DateUtils.startOfWeek(state.miniMonth);
        const selectedKey = DateUtils.toKey(state.currentDate);
        const todayKey = DateUtils.toKey(state.now);
        const selectedWeekKey = DateUtils.toKey(DateUtils.startOfWeek(state.currentDate));
        const weekdayLabels = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];

        const weeks = Array.from({ length: 6 }, (_, w) =>
          Array.from({ length: 7 }, (_, d) => DateUtils.addDays(gridStart, w * 7 + d)));

        const rows = weeks.map((week) => {
          const inSelectedWeek = DateUtils.toKey(week[0]) === selectedWeekKey;
          const cells = week.map((date) => {
            const key = DateUtils.toKey(date);
            const inMonth = date.getMonth() === state.miniMonth.getMonth();
            let tone = inMonth ? 'text-ink hover:bg-white/10' : 'text-ink-faint hover:bg-white/10';
            if (key === todayKey) tone = 'font-medium text-accent hover:bg-white/10';
            if (key === selectedKey) tone = 'bg-white font-medium text-black';
            return `
              <button type="button" data-date="${key}" aria-label="${DateUtils.formatLong(date)}"
                      ${key === selectedKey ? 'aria-current="date"' : ''}
                      class="mx-auto flex h-8 w-8 items-center justify-center rounded-full text-[13px] transition-colors ${tone}">
                ${date.getDate()}
              </button>`;
          }).join('');
          return `<div class="grid grid-cols-7 rounded-xl py-0.5 ${inSelectedWeek ? 'bg-white/[0.07]' : ''}">${cells}</div>`;
        }).join('');

        return `
          <section class="rounded-2xl bg-surface p-4" aria-label="Month navigator">
            <div class="mb-3 flex items-center justify-between">
              <button type="button" data-mini-shift="-1" aria-label="Previous month" class="rounded-full p-1 text-ink-muted hover:text-ink">${icon('chevronLeft', 'h-4 w-4')}</button>
              <h2 class="text-sm font-medium">${DateUtils.formatMonthYear(state.miniMonth)}</h2>
              <button type="button" data-mini-shift="1" aria-label="Next month" class="rounded-full p-1 text-ink-muted hover:text-ink">${icon('chevronRight', 'h-4 w-4')}</button>
            </div>
            <div class="mb-1 grid grid-cols-7 text-center text-xs text-ink-muted" aria-hidden="true">
              ${weekdayLabels.map((label) => `<span>${label}</span>`).join('')}
            </div>
            <div class="flex flex-col gap-0.5">${rows}</div>
          </section>`;
      },
      bind(el, { actions }) {
        el.addEventListener('click', (e) => {
          const shiftButton = e.target.closest('[data-mini-shift]');
          if (shiftButton) return actions.shiftMiniMonth(Number(shiftButton.dataset.miniShift));

          const dayButton = e.target.closest('[data-date]');
          if (dayButton) actions.selectDate(DateUtils.fromKey(dayButton.dataset.date));
        });
      },
    };

    /* ---------- 7.3b To-do list ----------
       Every schedule is a task: its deadline is the end of the event. "Done" is stored on the event
       (`completed`, `completedAt`). Open tasks are grouped Overdue / Today / Tomorrow / Later; the Done tab
       shows what was ticked off in the last week. Which tab, group and card is open is kept in `todoUi`
       (not in the store) so opening/closing can be animated on the live DOM without a re-render. */
    const TODO_WINDOW_MS = 7 * 24 * 60 * 60 * 1000; // completed tasks disappear this long after their deadline
    const todoUi = { tab: 'todo', closedGroups: new Set(), openTasks: new Set(), scroll: 0 };
    const TODO_GROUPS = [
      { id: 'overdue', label: 'Overdue' },
      { id: 'today', label: 'Today' },
      { id: 'tomorrow', label: 'Tomorrow' },
      { id: 'later', label: 'Later' },
    ];

    /** 90 minutes -> "1h", 4 days -> "4d", 2 weeks -> "2w", 40 days -> "1mo". */
    function relativeSpan(ms) {
      const minutes = Math.abs(ms) / 60_000;
      if (minutes < 60) return `${Math.max(1, Math.floor(minutes))}m`;
      const hours = minutes / 60;
      if (hours < 24) return `${Math.floor(hours)}h`;
      const days = hours / 24;
      if (days < 7) return `${Math.floor(days)}d`;
      if (days < 30) return `${Math.floor(days / 7)}w`;
      if (days < 365) return `${Math.floor(days / 30)}mo`;
      return `${Math.floor(days / 365)}y`;
    }

    /** Every visible schedule with its deadline (all-day ones are due at the end of the day). */
    function todoTasks(state) {
      const calendars = Selectors.calendarMap(state);
      return state.events.filter((event) => !event.holiday).map((event) => { // every task, even when its category is switched off in the calendar legend
        const due = DateUtils.fromKey(event.date);
        if (event.allDay) due.setHours(23, 59, 0, 0); else due.setMinutes(event.end ?? 0);
        return { event, due, calendar: calendars.get(event.calendarId) };
      });
    }

    function todoGroups(state) {
      const now = state.now.getTime();
      const todayKey = DateUtils.toKey(state.now);
      const tomorrowKey = DateUtils.toKey(DateUtils.addDays(state.now, 1));
      const open = todoTasks(state).filter((t) => !t.event.completed);
      const byDue = (a, b) => a.due - b.due;
      return {
        overdue: open.filter((t) => t.due < now).sort((a, b) => b.due - a.due), // never hidden until done
        today: open.filter((t) => t.due >= now && t.event.date === todayKey).sort(byDue),
        tomorrow: open.filter((t) => t.event.date === tomorrowKey).sort(byDue),
        later: open.filter((t) => t.event.date > tomorrowKey).sort(byDue),
      };
    }

    function renderTaskCard(task, state, done) {
      const { event, due, calendar } = task;
      const now = state.now.getTime();
      const color = calendar?.color ?? '#888';
      const open = todoUi.openTasks.has(event.id);
      const overdue = !done && due < now;
      const dueLabel = done
        ? (due < now
          ? `<span class="text-ink-muted">Due <span class="font-medium text-ink">${relativeSpan(now - due)}</span> ago</span>`
          : `<span class="text-ink-muted">Due <span class="font-medium text-ink">${relativeSpan(due - now)}</span></span>`)
        : overdue
          ? `<span class="rounded-full bg-red-500 px-2 py-0.5 text-[11px] font-medium text-white">Due ${relativeSpan(now - due)} ago</span>`
          : `<span class="text-ink-muted">Due <span class="font-medium text-ink">${relativeSpan(due - now)}</span></span>`;
      const link = /^https?:\/\//i.test(event.link ?? '') ? event.link : '';
      const description = event.description ? descriptionToHtml(event.description) : '';

      return `
        <div class="todo-item" data-task="${esc(event.id)}" ${done ? 'data-done' : ''} style="--task-color:${esc(color)}">
          <div><div class="pb-2">
            <div class="flex overflow-hidden rounded-xl border border-line bg-surface-raised">
              <span class="w-1.5 shrink-0" style="background:var(--task-color)" aria-hidden="true"></span>
              <div class="min-w-0 flex-1 p-3">
                <div class="flex items-start gap-2">
                  <div data-task-toggle role="button" tabindex="0" aria-expanded="${open}" class="min-w-0 flex-1 cursor-pointer rounded-md">
                    <div class="truncate text-[11px] uppercase tracking-wide text-ink-muted">${esc(calendar?.name ?? 'Task')}</div>
                    <div class="todo-title mt-0.5 break-words text-sm font-medium leading-snug">${esc(event.title || 'Untitled')}</div>
                    <div class="mt-1.5 text-xs">${dueLabel}</div>
                  </div>
                  <button type="button" data-task-check role="checkbox" aria-checked="${done}"
                          aria-label="${done ? 'Mark as not done' : 'Mark as done'}: ${esc(event.title || 'Untitled')}"
                          class="todo-check mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2">${icon('check', 'h-3.5 w-3.5')}</button>
                </div>
                <div class="todo-collapse" ${open ? '' : 'data-closed'}>
                  <div>
                    <div class="mt-3 flex flex-col gap-2 border-t border-line pt-3 text-xs text-ink-muted">
                      <div>${esc(DateUtils.formatAgendaDate(DateUtils.fromKey(event.date)))} · ${esc(DateUtils.formatRange(event))}</div>
                      ${(event.guests ?? []).length ? `<div class="truncate">${esc(event.guests.join(', '))}</div>` : ''}
                      ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer" class="truncate text-accent underline underline-offset-2">${esc(link)}</a>` : ''}
                      ${description ? `<div class="max-h-28 min-w-0 overflow-y-auto overflow-x-hidden whitespace-normal text-ink [overflow-wrap:anywhere] [&_*]:max-w-full [&_a]:text-accent [&_ol]:list-decimal [&_ol]:pl-4 [&_ul]:list-disc [&_ul]:pl-4">${description}</div>` : ''}
                      <button type="button" data-task-edit class="w-fit rounded-lg border border-line px-3 py-1.5 text-xs text-ink transition-colors hover:bg-white/5">${event.readOnly ? 'View task' : 'Edit task'}</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div></div>
        </div>`;
    }

    const TodoModule = {
      id: 'todo',
      slot: '#slot-todo',
      deps: (s) => [s.events, s.accounts, s.now],
      render(state) {
        const groups = todoGroups(state);
        const openCount = Object.values(groups).reduce((sum, list) => sum + list.length, 0);
        const doneTasks = todoTasks(state)
          .filter((t) => t.event.completed && t.due.getTime() >= state.now.getTime() - TODO_WINDOW_MS)
          .sort((a, b) => b.due - a.due);

        const tab = (id, label, count) => `
          <button type="button" data-todo-tab="${id}" role="tab" aria-selected="${todoUi.tab === id}"
                  class="flex flex-1 items-center justify-center gap-2 rounded-lg px-3 py-1.5 text-sm transition-colors ${todoUi.tab === id ? 'bg-white font-medium text-black' : 'text-ink-muted hover:text-ink'}">
            ${label}<span class="text-xs ${todoUi.tab === id ? 'text-black/60' : 'text-ink-faint'}">${count > 99 ? '99+' : count}</span>
          </button>`;

        let body;
        if (todoUi.tab === 'done') {
          body = doneTasks.length
            ? doneTasks.map((t) => renderTaskCard(t, state, true)).join('')
            : '<p class="rounded-xl border border-dashed border-line p-4 text-center text-sm text-ink-muted">Nothing completed in the last week.</p>';
        } else {
          const sections = TODO_GROUPS.filter((g) => groups[g.id].length).map((g) => {
            const closed = todoUi.closedGroups.has(g.id);
            return `
              <section data-group="${g.id}" class="mb-1">
                <button type="button" data-todo-group="${g.id}" aria-expanded="${!closed}"
                        class="flex w-full items-center justify-between gap-2 py-1.5 text-left text-xs font-medium uppercase tracking-wide ${g.id === 'overdue' ? 'text-red-400' : 'text-ink-muted'} hover:text-ink">
                  <span class="flex items-center gap-2">${g.label}<span class="rounded-full bg-white/10 px-1.5 text-[11px] normal-case tracking-normal text-ink">${groups[g.id].length}</span></span>
                  <span class="todo-chev">${icon('chevronDown', 'h-4 w-4')}</span>
                </button>
                <div class="todo-collapse" ${closed ? 'data-closed' : ''}>
                  <div class="pt-1">${groups[g.id].map((t) => renderTaskCard(t, state, false)).join('')}</div>
                </div>
              </section>`;
          }).join('');
          body = sections || '<p class="rounded-xl border border-dashed border-line p-4 text-center text-sm text-ink-muted">You\'re all caught up. Nothing due.</p>';
        }

        return `
          <section class="rounded-2xl bg-surface p-4" aria-label="To-do list">
            <h2 class="mb-3 text-sm font-medium">To-Do List</h2>
            <div role="tablist" class="mb-3 flex gap-1 rounded-xl bg-surface-raised p-1">
              ${tab('todo', 'To do', openCount)}${tab('done', 'Done', doneTasks.length)}
            </div>
            <div data-todo-scroll class="no-scrollbar max-h-[26rem] overflow-y-auto overflow-x-hidden">${body}</div>
          </section>`;
      },

      afterRender(el) {
        const scroller = el.querySelector('[data-todo-scroll]');
        if (scroller) scroller.scrollTop = todoUi.scroll;
      },

      bind(el, { store, actions }) {
        const rerender = () => {
          el.innerHTML = TodoModule.render(store.getState());
          TodoModule.afterRender(el);
        };
        el.addEventListener('scroll', (e) => {
          if (e.target.matches?.('[data-todo-scroll]')) todoUi.scroll = e.target.scrollTop;
        }, true);

        const toggleCard = (header) => {
          const item = header.closest('[data-task]');
          const panel = item.querySelector('.todo-collapse');
          const open = panel.hasAttribute('data-closed'); // it is about to open
          panel.toggleAttribute('data-closed', !open);
          header.setAttribute('aria-expanded', String(open));
          if (open) todoUi.openTasks.add(item.dataset.task); else todoUi.openTasks.delete(item.dataset.task);
        };

        el.addEventListener('click', (e) => {
          const tab = e.target.closest('[data-todo-tab]');
          if (tab) { todoUi.tab = tab.dataset.todoTab; todoUi.scroll = 0; return rerender(); }

          const groupHeader = e.target.closest('[data-todo-group]');
          if (groupHeader) {
            const id = groupHeader.dataset.todoGroup;
            const closing = groupHeader.getAttribute('aria-expanded') === 'true';
            groupHeader.setAttribute('aria-expanded', String(!closing));
            groupHeader.parentElement.querySelector(':scope > .todo-collapse').toggleAttribute('data-closed', closing);
            if (closing) todoUi.closedGroups.add(id); else todoUi.closedGroups.delete(id);
            return;
          }

          const check = e.target.closest('[data-task-check]');
          if (check) {
            const item = check.closest('[data-task]');
            if (item.hasAttribute('data-busy')) return;
            item.setAttribute('data-busy', '');
            const nowDone = !item.hasAttribute('data-done');
            item.toggleAttribute('data-done', nowDone); // fills the circle and strikes the title
            check.setAttribute('aria-checked', String(nowDone));
            // Let the tick and strike-through play, then slide the card away and update the store.
            setTimeout(() => {
              item.setAttribute('data-leaving', '');
              setTimeout(() => actions.toggleTaskDone(item.dataset.task), 300);
            }, 380);
            return;
          }

          const edit = e.target.closest('[data-task-edit]');
          if (edit) {
            const event = store.getState().events.find((ev) => ev.id === edit.closest('[data-task]').dataset.task);
            if (event) actions.openEditSchedule(event);
            return;
          }

          const header = e.target.closest('[data-task-toggle]');
          if (header) toggleCard(header);
        });

        el.addEventListener('keydown', (e) => {
          const header = e.target.closest?.('[data-task-toggle]');
          if (header && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleCard(header); }
        });
      },
    };

    /* ---------- 7.4 Calendar accounts ---------- */
    const AccountsModule = {
      id: 'accounts',
      slot: '#slot-accounts',
      deps: (s) => [s.accounts],
      render(state) {
        const accountCards = state.accounts.map((account) => {
          const calendars = account.expanded ? `
            <ul class="mt-3 flex flex-col gap-1">
              ${account.calendars.map((cal) => `
                <li>
                  <button type="button" data-account="${esc(account.id)}" data-calendar="${esc(cal.id)}"
                          aria-pressed="${cal.visible}"
                          class="flex w-full items-center gap-3 rounded-lg px-1 py-1.5 text-left text-sm hover:bg-white/5 ${cal.visible ? 'text-ink' : 'text-ink-faint'}">
                    <span class="h-3.5 w-3.5 shrink-0 rounded-[4px] border-2"
                          style="border-color:${esc(cal.color)};background:${cal.visible ? esc(cal.color) : 'transparent'}"></span>
                    <span class="truncate">${esc(cal.name)}</span>
                  </button>
                </li>`).join('')}
            </ul>` : '';

          return `
            <div class="rounded-2xl bg-surface p-4">
              <button type="button" data-toggle-account="${esc(account.id)}" aria-expanded="${account.expanded}"
                      class="flex w-full items-center justify-between gap-2 text-left text-sm">
                <span class="truncate">${esc(account.email)}</span>
                <span class="text-ink-muted">${icon(account.expanded ? 'chevronUp' : 'chevronDown', 'h-4 w-4')}</span>
              </button>
              ${calendars}
            </div>`;
        }).join('');

        return `
          ${accountCards}
          <button type="button" data-action="add-account"
                  class="flex w-full items-center justify-center gap-2 rounded-2xl bg-surface-raised p-4 text-sm text-ink-muted hover:text-ink">
            ${icon('plus', 'h-4 w-4')} Add calendar account
          </button>`;
      },
      bind(el, { actions }) {
        el.addEventListener('click', (e) => {
          const accountToggle = e.target.closest('[data-toggle-account]');
          if (accountToggle) return actions.toggleAccount(accountToggle.dataset.toggleAccount);

          const calendarToggle = e.target.closest('[data-calendar]');
          if (calendarToggle) return actions.toggleCalendar(calendarToggle.dataset.account, calendarToggle.dataset.calendar);

          if (e.target.closest('[data-action="add-account"]')) actions.showToast('Connect your account-linking flow here.');
        });
      },
    };

    /* ---------- 7.5 Calendar header ---------- */
    const CalendarHeaderModule = {
      id: 'calendar-header',
      slot: '#slot-calendar-header',
      deps: (s) => [s.currentDate, s.view, s.gcal, s.users, s.activeUserId],
      render(state) {
        // View buttons are generated from the CalendarViews registry.
        const viewButtons = Object.entries(CalendarViews).map(([id, view]) => {
          const active = id === state.view;
          return `
            <button type="button" data-view="${id}" aria-pressed="${active}"
                    class="rounded-lg px-3.5 py-1.5 transition-colors ${active ? 'bg-white font-medium text-black' : 'text-ink-muted hover:text-ink'}">
              ${esc(view.label)}
            </button>`;
        }).join('');

        const roundButton = 'flex h-9 w-9 items-center justify-center rounded-full border border-line bg-surface-raised text-ink-muted hover:text-ink';

        // Google sync pill: Google logo, a status light and a short label. Shown to guests and real Google accounts.
        const user = Selectors.activeUser(state);
        const { status, message, lastSync } = state.gcal;
        let syncButton = '';
        if (!user || GoogleCalendar.eligible(user)) {
          let label; let dot; let title;
          if (!user) { label = 'Sign in with Google'; dot = 'bg-ink-faint'; title = 'Sign in with Google to sync your tasks'; }
          else if (status === 'off') { label = message ? 'Reconnect' : 'Connect'; dot = message ? 'bg-red-400' : 'bg-ink-faint'; title = message || 'Connect Google Calendar and Tasks'; }
          else if (status === 'syncing') { label = 'Syncing…'; dot = 'bg-ink-faint animate-pulse'; title = 'Syncing with Google…'; }
          else if (status === 'error') { label = 'Sync error'; dot = 'bg-red-400'; title = message || 'Sync failed. Click to retry.'; }
          else {
            label = lastSync ? `Synced ${DateUtils.formatTime(DateUtils.minutesSinceMidnight(new Date(lastSync)))}` : 'Connected';
            dot = 'bg-accent';
            title = 'Synced with Google Calendar and Tasks. Click to sync now.';
          }
          const disconnect = user && status !== 'off' ? `
            <button type="button" data-action="disconnect" aria-label="Disconnect Google" title="Disconnect Google"
                    class="flex h-9 w-9 items-center justify-center rounded-full border border-line bg-surface-raised text-ink-muted hover:text-ink">${icon('close', 'h-4 w-4')}</button>` : '';
          syncButton = `
            <div class="flex items-center gap-1.5">
              <button type="button" data-action="sync" title="${esc(title)}" aria-label="${esc(label)}. ${esc(title)}" ${status === 'syncing' ? 'aria-busy="true"' : ''}
                      class="flex h-9 items-center gap-2.5 rounded-full border border-line bg-surface-raised pl-2.5 pr-3.5 text-sm transition-colors hover:bg-white/10">
                <span class="flex h-5 w-5 shrink-0 items-center justify-center">${GOOGLE_LOGO}</span>
                <span class="hidden whitespace-nowrap sm:inline">${esc(label)}</span>
                <span class="h-2 w-2 shrink-0 rounded-full ${dot}" aria-hidden="true"></span>
              </button>${disconnect}
            </div>`;
        }

        return `
          <div class="flex flex-wrap items-center gap-3 p-4 sm:p-5">
            <button type="button" data-action="today" class="rounded-xl border border-line bg-surface-raised px-4 py-2 text-sm hover:bg-white/10">Today</button>
            <div class="flex gap-1">
              <button type="button" data-shift="-1" aria-label="Previous" class="${roundButton}">${icon('chevronLeft', 'h-4 w-4')}</button>
              <button type="button" data-shift="1" aria-label="Next" class="${roundButton}">${icon('chevronRight', 'h-4 w-4')}</button>
            </div>
            <h1 class="mr-2 text-2xl">${DateUtils.formatMonthYear(state.currentDate)}</h1>
            <div class="ml-auto flex items-center gap-3">
              ${syncButton}
              <div role="group" aria-label="Calendar view" class="flex rounded-xl bg-surface-sunken p-1 text-sm">${viewButtons}</div>
              <button type="button" data-action="new"
                      class="flex items-center gap-2 rounded-xl bg-accent px-4 py-2 text-sm font-medium text-black hover:brightness-95">
                ${icon('plus', 'h-4 w-4')}<span class="hidden sm:inline">New task</span><span class="sr-only sm:hidden">New task</span>
              </button>
            </div>
          </div>`;
      },
      bind(el, { store, actions }) {
        el.addEventListener('click', (e) => {
          const viewButton = e.target.closest('[data-view]');
          if (viewButton) return actions.setView(viewButton.dataset.view);

          const shiftButton = e.target.closest('[data-shift]');
          if (shiftButton) return actions.shift(Number(shiftButton.dataset.shift));

          const actionButton = e.target.closest('[data-action]');
          if (actionButton?.dataset.action === 'today') actions.goToToday();
          if (actionButton?.dataset.action === 'new') actions.openNewSchedule();
          if (actionButton?.dataset.action === 'sync') {
            if (!store.getState().users.length) actions.openLogin('signin');
            else actions.syncOrConnectGoogle();
          }
          if (actionButton?.dataset.action === 'disconnect') actions.disconnectGoogle();
        });
      },
    };

    /* ---------- 7.6 Calendar body (renders the active view) ---------- */

    /** One timed event block inside a day column. */
    function renderTimedEvent({ event, lane, lanes }, calendar) {
      const H = CONFIG.HOUR_HEIGHT;
      const top = (event.start / 60) * H;
      const height = Math.max(((event.end - event.start) / 60) * H, 24);
      const width = 100 / lanes;
      const compact = height < 52;
      const range = DateUtils.formatRange(event);

      return `
        <button type="button" data-event-id="${esc(event.id)}"
                aria-label="${esc(event.title)}, ${range}"
                class="absolute overflow-hidden rounded-xl p-2 text-left text-xs leading-tight shadow-sm transition hover:brightness-110"
                style="top:${top}px;height:${height - 2}px;left:calc(${lane * width}% + 2px);width:calc(${width}% - 4px);background:${esc(calendar?.color ?? '#888')};color:${CONFIG.EVENT_TEXT_COLOR}">
          <span class="block truncate text-[13px] font-medium">${esc(event.title)}</span>
          ${compact ? '' : `<span class="mt-1 block opacity-70">${range}</span>`}
        </button>`;
    }

    /** Shared by Day and Week: a sticky header row + hour grid. */
    function renderTimeGrid(state, days) {
      const H = CONFIG.HOUR_HEIGHT;
      const calendars = Selectors.calendarMap(state);
      const byDate = Selectors.eventsByDate(state);
      const columns = `${CONFIG.GUTTER_WIDTH} repeat(${days.length}, minmax(0, 1fr))`;
      const minWidth = days.length > 1 ? '760px' : '320px';
      const todayKey = DateUtils.toKey(state.now);
      const nowMinutes = DateUtils.minutesSinceMidnight(state.now);
      const showNow = days.some((d) => DateUtils.toKey(d) === todayKey);

      const headerCells = days.map((date) => {
        const key = DateUtils.toKey(date);
        const isToday = key === todayKey;
        return `
          <button type="button" data-goto-day="${key}" aria-label="Open ${DateUtils.formatLong(date)}"
                  class="border-l border-line px-2 py-3 text-center text-sm hover:bg-white/5 ${isToday ? 'font-medium text-accent' : 'text-ink'}">
            ${DateUtils.formatWeekdayShort(date)} ${date.getDate()}
          </button>`;
      }).join('');

      const hourLabels = Array.from({ length: 23 }, (_, i) => i + 1).map((hour) =>
        `<span class="absolute right-2 -translate-y-1/2 text-xs text-ink-muted" style="top:${hour * H}px">${DateUtils.formatTime(hour * 60)}</span>`
      ).join('');

      const nowChip = showNow
        ? `<span class="absolute right-1 z-10 -translate-y-1/2 rounded-md bg-surface-raised px-1.5 py-0.5 text-[11px] ring-1 ring-line" style="top:${(nowMinutes / 60) * H}px">${DateUtils.formatTime(nowMinutes)}</span>`
        : '';

      // All-day events sit in a strip under the day headers instead of blocking the whole column.
      const hasAllDay = days.some((d) => (byDate.get(DateUtils.toKey(d)) ?? []).some((e) => e.allDay));
      const allDayCells = days.map((date) => {
        const pills = (byDate.get(DateUtils.toKey(date)) ?? []).filter((e) => e.allDay).map((event) => `
          <button type="button" data-event-id="${esc(event.id)}" aria-label="${esc(event.title)}, all day"
                  class="block w-full truncate rounded-md px-1.5 py-0.5 text-left text-[11px] font-medium hover:brightness-110"
                  style="background:${esc(calendars.get(event.calendarId)?.color ?? '#888')};color:${CONFIG.EVENT_TEXT_COLOR}">${esc(event.title)}</button>`).join('');
        return `<div class="flex flex-col gap-1 border-l border-line p-1">${pills}</div>`;
      }).join('');
      const allDayRow = hasAllDay
        ? `<div class="grid border-b border-line bg-surface-raised" style="grid-template-columns:${columns}">
             <div class="sticky left-0 z-10 flex items-start justify-center bg-surface-raised px-1 pt-2 text-[11px] text-ink-muted">All day</div>
             ${allDayCells}
           </div>`
        : '';

      const dayColumns = days.map((date) => {
        const key = DateUtils.toKey(date);
        const isToday = key === todayKey;
        const events = layoutOverlaps((byDate.get(key) ?? []).filter((e) => !e.allDay))
          .map((item) => renderTimedEvent(item, calendars.get(item.event.calendarId))).join('');
        const nowLine = isToday
          ? `<div class="pointer-events-none absolute inset-x-0 z-10 h-px bg-white" style="top:${(nowMinutes / 60) * H}px"></div>` : '';

        // The hour lines are a CSS gradient: one element instead of 24 divs.
        return `
          <div data-column-date="${key}" class="relative border-l border-line ${isToday ? 'bg-white/[0.02]' : ''}"
               style="background-image:repeating-linear-gradient(to bottom,transparent 0,transparent ${H - 1}px,var(--grid-line) ${H - 1}px,var(--grid-line) ${H}px)">

      return `

    function renderMonth(state) {
      const calendars = Selectors.calendarMap(state);
      const byDate = Selectors.eventsByDate(state);
      const gridStart = DateUtils.startOfWeek(DateUtils.firstOfMonth(state.currentDate));
      const todayKey = DateUtils.toKey(state.now);
      const days = Array.from({ length: 42 }, (_, i) => DateUtils.addDays(gridStart, i));
      const MAX_VISIBLE = 3;

      const weekdayHeader = days.slice(0, 7).map((d) =>
        `<div class="border-l border-line py-3 text-center text-sm text-ink-muted first:border-l-0">${DateUtils.formatWeekdayShort(d)}</div>`).join('');

      const cells = days.map((date) => {
        const key = DateUtils.toKey(date);
        const inMonth = date.getMonth() === state.currentDate.getMonth();
        const events = byDate.get(key) ?? [];
        const pills = events.slice(0, MAX_VISIBLE).map((event) => `
          <button type="button" data-event-id="${esc(event.id)}"
                  class="mb-1 block w-full truncate rounded-md px-1.5 py-0.5 text-left text-[11px] font-medium hover:brightness-110"
                  style="background:${esc(calendars.get(event.calendarId)?.color ?? '#888')};color:${CONFIG.EVENT_TEXT_COLOR}">
            ${esc(event.title)}
          </button>`).join('');
        const overflow = events.length > MAX_VISIBLE
          ? `<button type="button" data-goto-day="${key}" class="text-[11px] text-ink-muted hover:text-ink">+${events.length - MAX_VISIBLE} more</button>` : '';
        const dayTone = key === todayKey ? 'bg-accent font-medium text-black' : (inMonth ? 'text-ink' : 'text-ink-faint');

        return `
          <div data-cell-date="${key}" class="cursor-pointer border-b border-l border-line p-1.5 hover:bg-white/[0.03] ${inMonth ? '' : 'bg-black/20'}">
            <button type="button" data-goto-day="${key}" aria-label="Open ${DateUtils.formatLong(date)}"
                    class="mb-1 flex h-6 w-6 items-center justify-center rounded-full text-xs ${dayTone}">${date.getDate()}</button>
            ${pills}${overflow}
          </div>`;
      }).join('');

      return `
        <div class="flex min-h-full flex-col" style="min-width:640px">
          <div class="sticky top-0 z-30 grid grid-cols-7 border-b border-line bg-surface-raised">${weekdayHeader}</div>
          <div class="grid flex-1 grid-cols-7" style="grid-auto-rows:minmax(6.5rem,1fr)">${cells}</div>
        </div>`;
    }

    registerCalendarView('day', {
      label: 'Day',

      shift: (date, dir) => DateUtils.addDays(date, dir),
    });
    registerCalendarView('week', {
      label: 'Week',
      render: (state) => renderTimeGrid(state, getWeekDays(state.currentDate)),
      shift: (date, dir) => DateUtils.addDays(date, dir * 7),

    registerCalendarView('month', {

      render: renderMonth,

    const CalendarBodyModule = (() => {
      let lastView = null; // remembered so we only reset scroll when the view changes

      return {
        id: 'calendar-body',
        slot: '#slot-calendar-body',
        deps: (s) => [s.currentDate, s.view, s.events, s.accounts, s.now],
        render: (state) => CalendarViews[state.view].render(state),
        afterRender(el, state) {
          if (state.view !== lastView) {
            el.scrollTop = state.view === 'month' ? 0 : CONFIG.DEFAULT_SCROLL_HOUR * CONFIG.HOUR_HEIGHT;
            lastView = state.view;
          }
        },
        bind(el, { store, actions }) {
          el.addEventListener('click', (e) => {
            // Order matters: the most specific targets are checked first.
            const eventButton = e.target.closest('[data-event-id]');
            if (eventButton) {
              const found = store.getState().events.find((ev) => ev.id === eventButton.dataset.eventId);
              // Open all events (including readOnly Google Calendar events) in the Taskly schedule modal
              if (found) actions.openEditSchedule(found);
              return;
            }

            const dayButton = e.target.closest('[data-goto-day]');
            if (dayButton) return actions.showDay(DateUtils.fromKey(dayButton.dataset.gotoDay));

            // Clicking empty space in a time column creates an event at that time.
            const column = e.target.closest('[data-column-date]');
            if (column) {
              const y = e.clientY - column.getBoundingClientRect().top;
              const snapped = Math.floor(((y / CONFIG.HOUR_HEIGHT) * 60) / CONFIG.SNAP_MINUTES) * CONFIG.SNAP_MINUTES;
              return actions.openNewSchedule({ date: column.dataset.columnDate, start: Math.min(snapped, 23 * 60 + 30) });
            }

            const cell = e.target.closest('[data-cell-date]');
            if (cell) actions.openNewSchedule({ date: cell.dataset.cellDate, start: 9 * 60 });
          });
        },
      };

    /** The date field: typed text plus a hidden YYYY-MM-DD value that is what actually gets saved. */
