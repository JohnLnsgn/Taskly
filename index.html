                </div>

                <div data-field="guests">${fieldRow('user', `
                  <div id="guest-field" class="flex flex-1 flex-wrap items-center gap-2">
                    ${event.guests.map(renderGuestChip).join('')}
                    <input id="guest-input" type="email" placeholder="Add guests" autocomplete="off" aria-label="Add guest email" class="min-w-[6rem] flex-1 ${inputBase}" />
                  </div>`)}</div>

                <div data-field="link">${fieldRow('link', `<input name="link" type="url" value="${esc(event.link)}" placeholder="Add a meeting link" aria-label="Meeting link" class="${inputBase}" />`)}</div>

                ${renderDescriptionField(event)}

                ${renderPurposeField(purposeOptions, activePurpose)}
              </div>

              <p id="form-error" role="alert" class="mt-3 min-h-5 text-sm text-red-400"></p>

              <div class="mt-2 flex items-center justify-between gap-2">
                <div>${mode === 'edit' && !readOnly ? `<button type="button" data-delete-event class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm text-red-400 hover:bg-red-400/10">${icon('trash', 'h-4 w-4')}Delete</button>` : ''}</div>
                <div class="flex gap-2">
                  <button type="button" data-close-modal class="rounded-xl border border-line px-5 py-2.5 text-sm hover:bg-white/5">${readOnly ? 'Close' : 'Cancel'}</button>
                  ${readOnly ? '' : '<button type="submit" class="rounded-xl bg-white px-5 py-2.5 text-sm font-medium text-black hover:bg-white/90">Save</button>'}
                </div>
              </div>
            </form>
          </div>`;
      },

      afterRender(el, state) {
        if (state.modal?.event.readOnly) {
          // Lock everything: text stays selectable, but nothing can be typed, picked or removed.
          el.querySelector('#field-title')?.setAttribute('readonly', '');
          el.querySelectorAll('input:not(#field-title), [data-purpose-button]').forEach((control) => { control.disabled = true; });
          el.querySelectorAll('[data-remove-guest]').forEach((button) => button.remove());
          el.querySelectorAll('#field-title, [data-date-field], [data-field="time"], [data-field="guests"], [data-field="link"], [data-purpose-field]')
            .forEach((node) => node.classList.add('ro-field'));
          el.querySelector('[data-peek-open]')?.focus();
          return;
        }
        el.querySelector('[name="title"]')?.focus();
      },

      bind(el, { store, actions }) {
        const showError = (message) => {
          const target = el.querySelector('#form-error');
          if (target) target.textContent = message;
          if (el.querySelector('[data-peek-overlay]')) actions.showToast(message); // the form is hidden behind the expanded page
        };

        /** "Are you sure?" prompt on top of the schedule dialog. Added to the DOM directly so the form keeps its state. */
        const openDeleteConfirm = () => {
          if (el.querySelector('[data-confirm-overlay]')) return;
          const { modal } = store.getState();
          const title = String(modal?.event?.title ?? '').trim();
          el.insertAdjacentHTML('beforeend', `
            <div data-confirm-overlay class="fixed inset-0 z-[60] flex items-center justify-center overflow-y-auto bg-black/60 p-4 backdrop-blur-sm">
              <div role="alertdialog" aria-modal="true" aria-labelledby="confirm-delete-heading" aria-describedby="confirm-delete-text"
                   class="my-auto w-full max-w-sm rounded-3xl border border-line bg-surface p-6 shadow-2xl">
                <h2 id="confirm-delete-heading" class="text-xl">Delete this task?</h2>
                <p id="confirm-delete-text" class="mt-2 text-sm text-ink-muted">
                  ${title ? `"${esc(title)}" will be permanently deleted.` : 'This task will be permanently deleted.'}
                  This can't be undone.
                </p>
                <div class="mt-6 flex justify-end gap-2">
                  <button type="button" data-cancel-delete class="rounded-xl border border-line px-5 py-2.5 text-sm hover:bg-white/5">Cancel</button>
                  <button type="button" data-confirm-delete class="flex items-center gap-2 rounded-xl bg-red-500 px-5 py-2.5 text-sm font-medium text-white hover:bg-red-500/90">${icon('trash', 'h-4 w-4')}Delete</button>
                </div>
              </div>
            </div>`);
          el.querySelector('[data-cancel-delete]')?.focus();
        };
        const closeDeleteConfirm = () => {
          el.querySelector('[data-confirm-overlay]')?.remove();
          el.querySelector('[data-delete-event]')?.focus();
        };

        /** Turn whatever is typed in the guest box into a chip. Returns false if invalid. */
        const commitGuestInput = () => {
          const input = el.querySelector('#guest-input');
          const email = input?.value.trim().replace(/,$/, '');
          if (!email) return true;
          if (!EMAIL_PATTERN.test(email)) { showError(`"${email}" is not a valid email address.`); return false; }
          const alreadyAdded = [...el.querySelectorAll('[data-guest]')].some((chip) => chip.dataset.guest === email);
          if (!alreadyAdded) input.insertAdjacentHTML('beforebegin', renderGuestChip(email));
          input.value = '';
          showError('');
          return true;
        };

        /* ---------- Time pickers ---------- */
        const timeInput = (name) => el.querySelector(`input[name="${name}"]`);
        const timeList = (name) => el.querySelector(`#time-list-${name}`);
        const isListOpen = (name) => !timeList(name)?.hidden;
        const readMinutes = (name) => parseTimeInput(timeInput(name)?.value, { allowEndOfDay: name === 'end' })?.minutes ?? null;

        /** Mark the option matching `minutes` as active (hover/keyboard) and/or selected (current value). */
        function markOptions(name, { active, selected, scroll = true }) {
          const list = timeList(name);
          if (!list) return;
          const options = [...list.querySelectorAll('[data-time-option]')];
          // An end of 24:00 is shown (and listed) as 12:00 AM, the first row.
          selected = selected === 1440 ? 0 : selected;
          active = active === 1440 ? 0 : active;
          const nearest = (m) => m == null ? null : options.reduce((best, o) =>
            Math.abs(Number(o.dataset.timeOption) - m) < Math.abs(Number(best.dataset.timeOption) - m) ? o : best);
          const selectedEl = nearest(selected);
          const exact = selected != null && selectedEl && Number(selectedEl.dataset.timeOption) === selected;
          const activeEl = active === undefined ? null : nearest(active);
          options.forEach((o) => {
            o.toggleAttribute('data-selected', exact && o === selectedEl);
            o.toggleAttribute('data-active', o === (activeEl ?? (exact ? selectedEl : null)));
            o.setAttribute('aria-selected', String(exact && o === selectedEl));
          });
          const focusEl = activeEl ?? selectedEl;
          timeInput(name).setAttribute('aria-activedescendant', focusEl ? focusEl.id : '');
          if (scroll && focusEl) {
            // Bring the option to the top third of the list, like Google Calendar.
            list.scrollTop = Math.max(focusEl.offsetTop - list.clientHeight / 3, 0);
          }
        }

        function openList(name) {
          if (el.querySelector('input[name="allDay"]')?.checked) return;
          closeDatePanel();
          closePurpose();
          ['start', 'end'].filter((n) => n !== name).forEach(closeList);
          const list = timeList(name);
          if (!list || !list.hidden) return;
          list.hidden = false;
          timeInput(name).setAttribute('aria-expanded', 'true');
          markOptions(name, { selected: readMinutes(name) });
        }
        function closeList(name) {
          const list = timeList(name);
          if (!list || list.hidden) return;
          list.hidden = true;
          const input = timeInput(name);
          input.setAttribute('aria-expanded', 'false');
          input.removeAttribute('aria-activedescendant');
        }

        /** Tidy the typed text into hh:mm. Returns true when the value is valid. */
        function commitTime(name, { fixEnd = true } = {}) {
          const input = timeInput(name);
          if (!input || input.disabled) return true;
          const parsed = parseTimeInput(input.value, { allowEndOfDay: name === 'end' });
          if (!parsed) {
            input.setAttribute('aria-invalid', 'true');
            showError(TIME_ERROR);
            return false;
          }
          let { minutes } = parsed;
          // "5" typed as an end time after 16:30 almost certainly means 17:00.
          if (name === 'end' && fixEnd && !parsed.hadSuffix) {
            const start = readMinutes('start');
            if (start != null && minutes <= start && parsed.typedHours >= 1 && parsed.typedHours <= 11 && minutes + 720 <= 24 * 60) minutes += 720;
          }
          input.value = DateUtils.formatTimeField(minutes);
          input.removeAttribute('aria-invalid');
          const message = el.querySelector('#form-error');
          if (message?.textContent === TIME_ERROR) showError('');
          return true;
        }

        /** Choose a time from the list. Changing the start keeps the event's length. */
        function chooseTime(name, minutes) {
          if (name === 'start') {
            const oldStart = readMinutes('start');
            const oldEnd = readMinutes('end');
            if (oldStart != null && oldEnd != null && oldEnd > oldStart) {
              timeInput('end').value = DateUtils.formatTimeField(Math.min(minutes + (oldEnd - oldStart), 24 * 60));
              timeInput('end').removeAttribute('aria-invalid');
            }
          }
          const input = timeInput(name);
          input.value = DateUtils.formatTimeField(minutes);
          input.removeAttribute('aria-invalid');
          closeList(name);
          input.focus();
          input.select();
        }

        function setAllDay(checked) {
          ['start', 'end'].forEach((name) => {
            const input = timeInput(name);
            input.disabled = checked;
            if (checked) { closeList(name); input.removeAttribute('aria-invalid'); }
          });
          if (checked) {
            const message = el.querySelector('#form-error');
            if (message?.textContent === TIME_ERROR) showError('');
          }
        }

        /* ---------- Date picker ---------- */
        const dateInput = () => el.querySelector('input[name="dateText"]');
        const dateValue = () => el.querySelector('input[name="date"]');
        const datePanel = () => el.querySelector('#date-panel');
        const isDateOpen = () => !datePanel()?.hidden;
        const committedDate = () => DateUtils.fromKey(dateValue().value);
        const todayKey = () => DateUtils.toKey(store.getState().now);

        function drawDatePanel(viewDate, selectedDate) {
          const panel = datePanel();
          const view = DateUtils.firstOfMonth(viewDate);
          panel.dataset.view = DateUtils.toKey(view);
          panel.innerHTML = renderDatePanel(view, selectedDate ? DateUtils.toKey(selectedDate) : '', todayKey());
        }
        function openDatePanel() {
          ['start', 'end'].forEach(closeList);
          closePurpose();
          if (isDateOpen()) return;
          drawDatePanel(committedDate(), committedDate());
          datePanel().hidden = false;
          dateInput().setAttribute('aria-expanded', 'true');
        }
        function closeDatePanel() {
          const panel = datePanel();
          if (!panel || panel.hidden) return;
          panel.hidden = true;
          dateInput().setAttribute('aria-expanded', 'false');
        }
        function setDate(date) {
          dateValue().value = DateUtils.toKey(date);
          dateInput().value = DateUtils.formatDateField(date);
          dateInput().removeAttribute('aria-invalid');
          const message = el.querySelector('#form-error');
          if (message?.textContent === DATE_ERROR) showError('');
          if (isDateOpen()) drawDatePanel(date, date);
        }
        /** Tidy the typed text into "Weekday, Month Day". Returns true when it is a valid date. */
        function commitDate() {
          const input = dateInput();
          const parsed = parseDateInput(input.value, committedDate(), store.getState().now);
          if (!parsed) {
            input.setAttribute('aria-invalid', 'true');
            showError(DATE_ERROR);
            return false;
          }
          setDate(parsed);
          return true;
        }

        /* ---------- Purpose dropdown ---------- */
        const purposeButton = () => el.querySelector('[data-purpose-button]');
        const purposeList = () => el.querySelector('#purpose-list');
        const isPurposeOpen = () => !purposeList()?.hidden;
        const purposeOptions = () => [...el.querySelectorAll('[data-purpose-option]')];

        function markPurpose(activeId) {
          purposeOptions().forEach((o) => o.toggleAttribute('data-active', o.dataset.purposeOption === activeId));
          purposeButton().setAttribute('aria-activedescendant', activeId ? `purpose-opt-${activeId}` : '');
        }
        function openPurpose() {
          if (!purposeList() || isPurposeOpen()) return;
          closeDatePanel();
          ['start', 'end'].forEach(closeList);
          purposeList().hidden = false;
          purposeButton().setAttribute('aria-expanded', 'true');
          purposeButton().querySelector('[data-purpose-chevron]').classList.add('rotate-180');
          markPurpose(el.querySelector('input[name="calendarId"]').value);
        }
        function closePurpose() {
          if (!purposeList() || !isPurposeOpen()) return;
          purposeList().hidden = true;
          const button = purposeButton();
          button.setAttribute('aria-expanded', 'false');
          button.removeAttribute('aria-activedescendant');
          button.querySelector('[data-purpose-chevron]').classList.remove('rotate-180');
        }
        function choosePurpose(id) {
          const option = purposeOptions().find((o) => o.dataset.purposeOption === id);
          if (!option) return;
          el.querySelector('input[name="calendarId"]').value = id;
          el.querySelector('[data-purpose-label]').textContent = option.textContent.trim();
          el.querySelector('[data-purpose-dot]').style.background = option.dataset.color;
          purposeOptions().forEach((o) => {
            o.toggleAttribute('data-selected', o === option);
            o.setAttribute('aria-selected', String(o === option));
          });
          closePurpose();
          purposeButton().focus();
        }

        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-purpose-button]')) return isPurposeOpen() ? closePurpose() : openPurpose();
          const option = e.target.closest('[data-purpose-option]');
          if (option) return choosePurpose(option.dataset.purposeOption);
          closePurpose(); // any other click closes it
        });
        el.addEventListener('mouseover', (e) => {
          const option = e.target.closest('[data-purpose-option]');
          if (option) markPurpose(option.dataset.purposeOption);
        });
        el.addEventListener('focusout', (e) => {
          if (e.target.closest?.('[data-purpose-button]') && !e.relatedTarget?.closest?.('#purpose-list')) closePurpose();
        });
        el.addEventListener('keydown', (e) => {
          if (!e.target.closest?.('[data-purpose-button]')) return;
          const ids = purposeOptions().map((o) => o.dataset.purposeOption);
          const activeId = () => el.querySelector('[data-purpose-option][data-active]')?.dataset.purposeOption
            ?? el.querySelector('input[name="calendarId"]').value;

          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (!isPurposeOpen()) return openPurpose();
            const i = ids.indexOf(activeId()) + (e.key === 'ArrowDown' ? 1 : -1);
            markPurpose(ids[Math.min(Math.max(i, 0), ids.length - 1)]);
          } else if (e.key === 'Enter' || e.key === ' ') {
            if (!isPurposeOpen() && e.key === 'Enter') return; // Enter on a closed dropdown submits as usual
            e.preventDefault();
            if (isPurposeOpen()) choosePurpose(activeId()); else openPurpose();
          } else if (e.key === 'Escape' && isPurposeOpen()) {
            e.stopPropagation(); // close the list, not the whole dialog
            closePurpose();
          } else if (e.key === 'Tab') {
            closePurpose();
          }
        });

        // Focus/click opens the list and selects the text so typing replaces it.
        el.addEventListener('focusin', (e) => {
          if (e.target.name === 'dateText') {
            e.target.dataset.justFocused = 'true';
            openDatePanel();
            e.target.select();
            return;
          }
          const name = e.target.closest?.('[data-time-field] input')?.name;
          if (!name) return;
          e.target.dataset.justFocused = 'true';
          openList(name);
          e.target.select();
        });
        el.addEventListener('mouseup', (e) => {
          if (e.target.dataset?.justFocused) { e.preventDefault(); delete e.target.dataset.justFocused; }
        });
        el.addEventListener('click', (e) => {
          if (e.target.name === 'dateText') return openDatePanel();
          const name = e.target.closest?.('[data-time-field] input')?.name;
          if (name) openList(name);
        });
        el.addEventListener('focusout', (e) => {
          if (e.target.name === 'dateText') {
            delete e.target.dataset.justFocused;
            closeDatePanel();
            if (e.target.value.trim()) commitDate();
            return;
          }
          const name = e.target.closest?.('[data-time-field] input')?.name;
          if (!name) return;
          if (e.relatedTarget?.closest?.('[role="listbox"]')) return;
          delete e.target.dataset.justFocused;
          closeList(name);
          if (e.target.value.trim()) commitTime(name);
        });
        el.addEventListener('input', (e) => {
          if (e.target.matches?.('[data-rich-editor]')) return syncEditor();
          if (e.target.name === 'dateText') {
            e.target.removeAttribute('aria-invalid');
            openDatePanel();
            const parsed = parseDateInput(e.target.value, committedDate(), store.getState().now);
            if (parsed) drawDatePanel(parsed, parsed); // jump the calendar to what is being typed
            return;
          }
          const name = e.target.closest?.('[data-time-field] input')?.name;
          if (!name) return;
          e.target.removeAttribute('aria-invalid');
          openList(name);
          const parsed = parseTimeInput(e.target.value, { allowEndOfDay: name === 'end' });
          markOptions(name, { selected: parsed?.minutes });
        });
        // Options: mousedown is cancelled so the input keeps focus (no blur flicker).
        el.addEventListener('mousedown', (e) => {
          // Keep focus in the input while using either dropdown (also covers dragging the scrollbar).
          if (e.target.closest('[role="listbox"], [data-date-panel]')) e.preventDefault();
        });
        el.addEventListener('mouseover', (e) => {
          const option = e.target.closest('[data-time-option]');
          if (!option) return;
          const name = option.closest('[data-time-field]').dataset.timeField;
          markOptions(name, { active: Number(option.dataset.timeOption), selected: readMinutes(name), scroll: false });
        });
        el.addEventListener('click', (e) => {
          const option = e.target.closest('[data-time-option]');
          if (option) return chooseTime(option.closest('[data-time-field]').dataset.timeField, Number(option.dataset.timeOption));

          const shift = e.target.closest('[data-cal-shift]');
          if (shift) {
            const view = DateUtils.fromKey(datePanel().dataset.view);
            return drawDatePanel(DateUtils.addMonthsClamped(view, Number(shift.dataset.calShift)), parseDateInput(dateInput().value, committedDate(), store.getState().now));
          }
          const day = e.target.closest('[data-cal-day]');
          if (day) {
            setDate(DateUtils.fromKey(day.dataset.calDay));
            closeDatePanel();
            dateInput().focus();
            return dateInput().select();
          }
          if (!e.target.closest('[data-time-field]')) ['start', 'end'].forEach(closeList);
          if (!e.target.closest('[data-date-field]')) closeDatePanel();
        });
        el.addEventListener('keydown', (e) => {
          if (e.target.name === 'dateText') {
            const current = () => parseDateInput(e.target.value, committedDate(), store.getState().now) ?? committedDate();
            const step = { ArrowUp: -7, ArrowDown: 7 }[e.key];
            if (step) {           // up/down move by a week, like moving through the calendar grid
              e.preventDefault();
              if (!isDateOpen()) return openDatePanel();
              const next = DateUtils.addDays(current(), step);
              setDate(next); e.target.select();
            } else if (e.key === 'PageUp' || e.key === 'PageDown') {
              e.preventDefault();
              if (!isDateOpen()) openDatePanel();
              setDate(DateUtils.addMonthsClamped(current(), e.key === 'PageUp' ? -1 : 1)); e.target.select();
            } else if (e.key === 'Enter' && isDateOpen()) {
              e.preventDefault();
              if (commitDate()) closeDatePanel();
            } else if (e.key === 'Escape' && isDateOpen()) {
              e.stopPropagation(); // close the calendar, not the whole dialog
              closeDatePanel();
            } else if (e.key === 'Tab') {
              closeDatePanel();
            }
            return;
          }
          const name = e.target.closest?.('[data-time-field] input')?.name;
          if (!name) return;
          const list = timeList(name);
          const current = () => Number(list.querySelector('[data-active]')?.dataset.timeOption ?? NaN);

          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            if (!isListOpen(name)) return openList(name);
            const rawFrom = Number.isNaN(current()) ? readMinutes(name) : current();
            const from = rawFrom === 1440 ? 0 : rawFrom;
            const dir = e.key === 'ArrowDown' ? 1 : -1;
            const base = from == null ? (dir > 0 ? -TIME_STEP : 24 * 60) : from;
            const next = dir > 0 ? Math.floor(base / TIME_STEP) * TIME_STEP + TIME_STEP : Math.ceil(base / TIME_STEP) * TIME_STEP - TIME_STEP;
            const clamped = Math.min(Math.max(next, 0), 24 * 60 - TIME_STEP);
            markOptions(name, { active: clamped, selected: readMinutes(name) });
            list.querySelector('[data-active]')?.scrollIntoView({ block: 'nearest' });
          } else if (e.key === 'Enter') {
            if (isListOpen(name) && !Number.isNaN(current())) {
              e.preventDefault();
              chooseTime(name, current());
            } else if (isListOpen(name)) {
              e.preventDefault();
              if (commitTime(name)) closeList(name);
            }
            // With the list closed, Enter falls through and submits the form.
          } else if (e.key === 'Escape' && isListOpen(name)) {
            e.stopPropagation(); // close the list, not the whole dialog
            closeList(name);
          } else if (e.key === 'Tab') {
            closeList(name);
          }
        });

        /* ---- Description: rich-text editor + Google Drive attachments ---- */
        const RICH_COMMANDS = { bold: 'bold', italic: 'italic', underline: 'underline', ol: 'insertOrderedList', ul: 'insertUnorderedList' };
        const editorEl = () => el.querySelector('[data-rich-editor]');
        const panelEl = () => el.querySelector('[data-rich-panel]');
        let savedRange = null; // the text selection, remembered while a link box has the keyboard
        let panelMode = null;  // null | 'link' | 'drive'

        const insideEditor = (node) => Boolean(node && editorEl()?.contains(node));
        const currentRange = () => (savedRange && insideEditor(savedRange.commonAncestorContainer) ? savedRange : null);
        const linkAt = (node) => {
          const link = (node?.nodeType === 1 ? node : node?.parentElement)?.closest?.('a');
          return link && insideEditor(link) ? link : null;
        };

        const syncEditor = () => {
          const editor = editorEl();
          if (!editor) return;
          const empty = editor.textContent.trim() === '' && !editor.querySelector('li, a');
          if (empty && /^(<div>)?<br>(<\/div>)?$/i.test(editor.innerHTML)) editor.innerHTML = ''; // lets the placeholder show
          editor.dataset.empty = String(empty);
        };

        const updateToolbar = () => {
          const selection = getSelection();
          const inside = Boolean(selection?.rangeCount) && insideEditor(selection.anchorNode);
          el.querySelectorAll('[data-state-cmd]').forEach((button) => {
            let on = false;
            if (inside) { try { on = document.queryCommandState(button.dataset.stateCmd); } catch { on = false; } }
            button.setAttribute('aria-pressed', String(on));
          });
        };

        document.addEventListener('selectionchange', () => {
          const selection = getSelection();
          if (selection?.rangeCount && insideEditor(selection.anchorNode)) {
            savedRange = selection.getRangeAt(0).cloneRange();
            updateToolbar();
          }
        });

        const restoreSelection = () => {
          const editor = editorEl();
          if (!editor) return;
          editor.focus();
          const range = currentRange();
          if (range) { const selection = getSelection(); selection.removeAllRanges(); selection.addRange(range); }
        };

        const panelError = (message) => {
          const target = panelEl()?.querySelector('[data-panel-error]');
          if (target) target.textContent = message;
        };

        const closePanel = ({ restore = true } = {}) => {
          const panel = panelEl();
          if (!panel) return;
          panel.classList.add('hidden');
          panel.classList.remove('flex');
          panel.innerHTML = '';
          panelMode = null;
          if (restore) restoreSelection();
        };

        const openPanel = (mode) => {
          const panel = panelEl();
          if (!panel) return;
          showError('');
          panelMode = mode;
          const input = 'min-w-0 flex-1 bg-transparent text-sm outline-none placeholder:text-ink-faint';
          const apply = '<button type="button" data-panel-apply class="rounded-lg bg-white px-3 py-1.5 text-xs font-medium text-black hover:bg-white/90">';
          const close = `<button type="button" data-panel-close aria-label="Close" class="rounded-full p-1 text-ink-muted hover:text-ink">${icon('close', 'h-3.5 w-3.5')}</button>`;
          if (mode === 'link') {
            const existing = linkAt(currentRange()?.commonAncestorContainer);
            panel.innerHTML = `
              <span class="shrink-0 text-ink-muted">${icon('link', 'h-4 w-4')}</span>
              <input data-panel-input type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-label="Link address"
                     placeholder="Paste or type a link" value="${esc(existing?.getAttribute('href') ?? '')}" class="${input}" />
              ${existing ? '<button type="button" data-panel-remove class="rounded-lg px-3 py-1.5 text-xs text-red-400 hover:bg-red-400/10">Remove</button>' : ''}
              ${apply}Apply</button>${close}
              <span data-panel-error role="alert" class="w-full text-xs text-red-400 empty:hidden"></span>`;
          } else {
            panel.innerHTML = `
              <span class="shrink-0 text-ink-muted">${icon('drive', 'h-4 w-4')}</span>
              <input data-panel-input type="text" inputmode="url" autocomplete="off" spellcheck="false" aria-label="Google Drive link"
                     placeholder="Paste a Google Drive or Docs link" class="min-w-[10rem] ${input}" />
              <input data-panel-name type="text" autocomplete="off" aria-label="File name (optional)" placeholder="Name (optional)"
                     class="w-32 bg-transparent text-sm outline-none placeholder:text-ink-faint" />
              ${apply}Attach</button>${close}
              <span data-panel-error role="alert" class="w-full text-xs text-red-400 empty:hidden"></span>`;
          }
          panel.classList.remove('hidden');
          panel.classList.add('flex');
          panel.querySelector('[data-panel-input]')?.focus();
        };

        const addAttachments = (files) => {
          const box = el.querySelector('[data-attachments]');
          if (!box) return;
          const keyOf = (file) => file.fileId || file.fileUrl;
          const have = new Set([...box.querySelectorAll('[data-attachment]')].map((chip) => chip.dataset.fileId || chip.dataset.fileUrl));
          files.map(normalizeAttachment).filter(Boolean).forEach((file) => {
            if (have.has(keyOf(file))) return;
            if (have.size >= MAX_ATTACHMENTS) return showError(`You can attach up to ${MAX_ATTACHMENTS} files.`);
            box.insertAdjacentHTML('beforeend', renderAttachmentChip(file));
            have.add(keyOf(file));
          });
        };

        const attachFromDrive = async () => {
          const user = googleUserOf(store.getState());
          if (!DriveAttach.available(user)) return panelMode === 'drive' ? closePanel() : openPanel('drive');
          showError('');
          try {
            const files = await DriveAttach.pick(user);
            if (files.length) addAttachments(files);
          } catch (error) {
            if (!error.cancelled) showError(error.message);
          }
        };

        const removeLink = () => {
          const existing = linkAt(currentRange()?.commonAncestorContainer);
          closePanel();
          if (existing) {
            const range = document.createRange();
            range.selectNodeContents(existing);
            const selection = getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('unlink');
          }
          syncEditor();
        };

        const applyPanel = () => {
          const panel = panelEl();
          const raw = panel?.querySelector('[data-panel-input]')?.value.trim() ?? '';

          if (panelMode === 'drive') {
            const parsed = parseDriveLink(raw);
            if (!parsed) return panelError("That doesn't look like a Google Drive or Docs link.");
            const name = panel.querySelector('[data-panel-name]')?.value.trim();
            addAttachments([{ ...parsed, title: name || parsed.title }]);
            return closePanel({ restore: false });
          }

          if (!raw) return linkAt(currentRange()?.commonAncestorContainer) ? removeLink() : closePanel();
          let url = raw;
          if (!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = EMAIL_PATTERN.test(url) ? `mailto:${url}` : `https://${url}`;
          if (!SAFE_URL.test(url)) return panelError('Links must start with http://, https:// or mailto:');
          try { if (!/^mailto:/i.test(url)) new URL(url); } catch { return panelError('Enter a valid link.'); }

          closePanel(); // gives the selection back to the editor
          const selection = getSelection();
          const existing = linkAt(selection.anchorNode);
          if (existing && selection.isCollapsed) existing.setAttribute('href', url);
          else if (selection.isCollapsed) document.execCommand('insertHTML', false, `<a href="${esc(url)}">${esc(url)}</a>&nbsp;`);
          else document.execCommand('createLink', false, url);
          syncEditor();
        };

        const runRichCommand = (cmd) => {
          if (cmd === 'drive') return attachFromDrive();
          if (cmd === 'link') return panelMode === 'link' ? closePanel() : openPanel('link');
          if (panelMode) closePanel({ restore: false });
          editorEl()?.focus();
          if (RICH_COMMANDS[cmd]) document.execCommand(RICH_COMMANDS[cmd]);
          else if (cmd === 'clear') { document.execCommand('removeFormat'); document.execCommand('unlink'); }
          syncEditor();
          updateToolbar();
        };

        // Toolbar buttons must not steal focus, or the text selection would be lost before the command runs.
        el.addEventListener('mousedown', (e) => {
          if (e.target.closest('[data-rich-toolbar] button')) e.preventDefault();
        });

        el.addEventListener('focusin', (e) => {
          if (e.target.matches?.('[data-rich-editor]')) { try { document.execCommand('styleWithCSS', false, false); } catch { /* older browsers */ } }
        });

        el.addEventListener('click', (e) => {
          const cmd = e.target.closest('[data-rich-cmd]')?.dataset.richCmd;
          if (cmd) return runRichCommand(cmd);
          if (e.target.closest('[data-panel-apply]')) return applyPanel();
          if (e.target.closest('[data-panel-remove]')) return removeLink();
          if (e.target.closest('[data-panel-close]')) return closePanel();
          const removeAttachment = e.target.closest('[data-remove-attachment]');
          if (removeAttachment) return removeAttachment.closest('[data-attachment]').remove();
          const link = e.target.closest('[data-rich-editor] a');
          if (link && (e.ctrlKey || e.metaKey)) window.open(link.href, '_blank', 'noopener,noreferrer');
        });

        el.addEventListener('keydown', (e) => {
          if (e.target.closest('[data-rich-panel]')) {
            if (e.key === 'Enter') { e.preventDefault(); applyPanel(); }      // Enter must not submit the whole form
            else if (e.key === 'Escape') { e.stopPropagation(); closePanel(); } // close the box, not the whole dialog
            return;
          }
          if (e.target.closest('[data-rich-editor]') && (e.ctrlKey || e.metaKey) && !e.altKey) {
            const key = e.key.toLowerCase();
            if (key === 'k') {
              e.preventDefault();
              openPanel('link');
            } else if (key === 'b' || key === 'i' || key === 'u') {
              // With nothing selected the browser fires no selection event, so refresh the highlight ourselves
              // once the shortcut has taken effect.
              setTimeout(updateToolbar, 0);
            }
          }
        });

        // Pasted content is rebuilt from the safe subset, so no stray fonts, colours or scripts come along.
        el.addEventListener('paste', (e) => {
          if (!e.target.closest?.('[data-rich-editor]')) return;
          e.preventDefault();
          const html = e.clipboardData.getData('text/html');
          const text = e.clipboardData.getData('text/plain');
          const clean = html ? sanitizeRichText(html) : sanitizeRichText(esc(text).replace(/\r?\n/g, '<br>'));
          if (clean) document.execCommand('insertHTML', false, clean);
          syncEditor();
        });

        el.addEventListener('change', (e) => {
          if (e.target.name === 'allDay') setAllDay(e.target.checked);
        });

        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-close-modal]') || e.target.matches('[data-modal-overlay]')) return actions.closeModal();

          const removeGuest = e.target.closest('[data-remove-guest]');
          if (removeGuest) return removeGuest.closest('[data-guest]').remove();

          // Delete asks for confirmation first; nothing is removed until "Delete" is pressed in the prompt.
          if (e.target.closest('[data-delete-event]')) return openDeleteConfirm();

          if (e.target.closest('[data-confirm-delete]')) {
            const { modal } = store.getState();
            if (modal?.event.id) actions.deleteEvent(modal.event.id);
            return;
          }
          if (e.target.closest('[data-cancel-delete]') || e.target.matches('[data-confirm-overlay]')) closeDeleteConfirm();
        });

        el.addEventListener('keydown', (e) => {
          if (!el.querySelector('[data-confirm-overlay]')) return;
          if (e.key === 'Escape') {
            e.stopPropagation(); // close the prompt, not the whole schedule dialog
            closeDeleteConfirm();
          } else if (e.key === 'Tab') {
            // Keep focus inside the prompt while it is open.
            const buttons = [...el.querySelectorAll('[data-confirm-overlay] button')];
            const i = buttons.indexOf(document.activeElement);
            e.preventDefault();
            buttons[(i + (e.shiftKey ? -1 : 1) + buttons.length) % buttons.length].focus();
          }
        });

        el.addEventListener('keydown', (e) => {
          if (e.target.id === 'guest-input' && (e.key === 'Enter' || e.key === ',')) {
            e.preventDefault(); // Enter must not submit the whole form
            commitGuestInput();
          }
        });

        el.addEventListener('submit', (e) => {
          e.preventDefault();
          if (store.getState().modal?.event.readOnly) return;
          if (!commitGuestInput()) return;

          const form = e.target;
          const data = new FormData(form);
          const title = String(data.get('title') ?? '').trim();
          if (!dateInput().value.trim()) return showError('Choose a date.');
          if (!commitDate()) return;
          const date = dateValue().value;
          const allDay = form.elements.allDay.checked;
          const link = String(data.get('link') ?? '').trim();

          // Validate on the way in, and tell the user exactly what to fix.
          if (!title) return showError('Add a title before saving.');
          if (!date) return showError('Choose a date.');
          let start = 0;
          let end = 24 * 60;
          if (!allDay) {
            if (!commitTime('start') || !commitTime('end')) return;
            start = readMinutes('start');
            end = readMinutes('end');
            if (end <= start) return showError('The end time must be after the start time.');
          }
          if (link && !/^https?:\/\//i.test(link)) return showError('The meeting link must start with http:// or https://.');

          const wasDone = Boolean(store.getState().modal?.event.completed);
          const completed = form.elements.completed.checked;
          actions.saveEvent({
            id: store.getState().modal?.event.id ?? null,
            title, date, start, end, allDay, link,
            completed,
            completedAt: !completed ? null : wasDone ? (store.getState().modal.event.completedAt ?? Date.now()) : Date.now(),
            description: sanitizeRichText(editorEl()?.innerHTML ?? ''),
            attachments: [...el.querySelectorAll('[data-attachment]')].map((chip) => ({
              fileId: chip.dataset.fileId, fileUrl: chip.dataset.fileUrl, title: chip.dataset.title,
              mimeType: chip.dataset.mime, iconLink: chip.dataset.icon,
            })),
            calendarId: String(data.get('calendarId')),
            guests: [...el.querySelectorAll('[data-guest]')].map((chip) => chip.dataset.guest),
          });
        });

        /* ---------- Expanded, Notion-style schedule page ----------
           The real form fields (title, date, time, purpose, guests, link, description) are MOVED (not copied)
           into a wide page, so every handler above keeps working and everything stays editable without
           collapsing. Moved inputs keep a form="schedule-form" link, so Save still sees them. */
        const PEEK_MS = 360;
        const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
        let peek = null; // { overlay, panel, moved: [{ node, placeholder }], box, descPlaceholder, colors, closing }
        const peekAlive = () => Boolean(peek && peek.overlay.isConnected);

        // Real form fields that are moved into the page: [slot key, icon, label, selector in the form].
        const PEEK_FIELDS = [
          ['date', 'calendarSmall', 'Date', '[data-date-field]'],
          ['time', 'clock', 'Time', '[data-field="time"]'],
          ['purpose', 'tag', 'Purpose', '[data-purpose-field]'],
          ['guests', 'user', 'Guests', '[data-field="guests"]'],
          ['link', 'link', 'Meeting link', '[data-field="link"]'],
          ['completed', 'checkSquare', 'Status', '[data-field="completed"]'],
        ];

        const peekRow = (iconName, label, valueHtml, isField = false) => `
          <div class="flex items-start gap-2 rounded-md px-1.5 py-1">
            <div class="flex w-36 shrink-0 items-center gap-2 text-sm text-ink-muted ${isField ? 'py-3' : 'py-1'}">
              <span class="shrink-0">${icon(iconName, 'h-4 w-4')}</span><span class="truncate">${esc(label)}</span>
            </div>
            <div class="min-w-0 flex-1 text-sm ${isField ? '' : 'py-1'}">${valueHtml}</div>
          </div>`;
        const pill = (inner) =>
          `<span class="inline-flex max-w-full items-center gap-1.5 rounded-md bg-white/10 px-2 py-0.5 text-[13px]">${inner}</span>`;

        /** The page's frame. The editable fields are MOVED in afterwards (see openPeek); only read-only details are drawn here. */
        function peekMarkup() {
          const { modal } = store.getState();
          const event = modal?.event ?? {};
          const link = el.querySelector('input[name="link"]')?.value.trim() ?? '';

          const readOnly = Boolean(event.readOnly);
          const place = event.gx?.place ?? '';
          const rows = [
            ...PEEK_FIELDS.filter(([, , , selector]) => el.querySelector(selector))
              .map(([key, iconName, label]) => peekRow(iconName, label, `<div data-peek-slot="${key}"></div>`, true)),
            place ? peekRow('mapPin', 'Location', esc(place)) : '',
            peekRow('globe', 'Source', event.onGoogle
              ? `${pill('Google Calendar')}${event.readOnly ? '<span class="ml-2 text-ink-faint">Read-only</span>' : ''}`
              : pill('Taskly')),
            event.htmlLink
              ? peekRow('link', 'Open in', `<a href="${esc(event.htmlLink)}" target="_blank" rel="noopener noreferrer" class="underline decoration-white/30 underline-offset-2 hover:decoration-white">Google Calendar</a>`)
              : '',
          ].join('');

          const dateKey = dateValue()?.value;
          const headerDate = dateKey ? DateUtils.fromKey(dateKey).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
          const iconButton = 'flex h-8 w-8 items-center justify-center rounded-md text-ink-muted transition-colors hover:bg-white/10 hover:text-ink';

          return `
            <div data-peek-overlay class="fixed inset-0 z-[55] flex items-center justify-center bg-black/55 p-3 backdrop-blur-sm sm:p-8">
              <div data-peek-panel role="dialog" aria-modal="true" aria-label="Task details" tabindex="-1"
                   class="relative flex h-full max-h-[900px] w-full max-w-[920px] flex-col overflow-hidden rounded-2xl border border-line bg-surface-raised shadow-2xl shadow-black/70 outline-none">
                <div data-peek-fade class="flex shrink-0 items-center justify-between gap-2 px-4 py-3">
                  <div class="flex min-w-0 items-center gap-2">
                    <button type="button" data-peek-close aria-label="Collapse" data-tip="Collapse&#10;Esc" data-tip-align="left" class="${iconButton}">${icon('collapse', 'h-4 w-4')}</button>
                    <span class="h-4 w-px bg-line" aria-hidden="true"></span>
                    <span class="truncate text-sm text-ink-muted">${readOnly ? 'View task' : (modal?.mode === 'edit' ? 'Edit task' : 'New task')}${headerDate ? ` · ${esc(headerDate)}` : ''}</span>
                  </div>
                  <div class="flex items-center gap-1">
                    ${/^https?:\/\//i.test(link) ? `<button type="button" data-peek-copy aria-label="Copy meeting link" data-tip="Copy meeting link" class="${iconButton}">${icon('copy', 'h-4 w-4')}</button>` : ''}
                    <button type="button" data-peek-close aria-label="Close" class="${iconButton}">${icon('close', 'h-4 w-4')}</button>
                  </div>
                </div>
                <div class="min-h-0 flex-1 overflow-y-auto">
                  <div class="mx-auto w-full max-w-[720px] px-6 pb-20 pt-8 sm:px-10">
                    <div data-peek-fade>
                      ${readOnly ? `<div class="mb-5">${renderReadOnlyBanner(event)}</div>` : ''}
                      <div data-peek-slot="title"></div>
                      <div class="mt-5 flex flex-col gap-0.5">${rows}</div>
                      <div class="my-6 h-px bg-line" aria-hidden="true"></div>
                      <div class="mb-2 flex items-center gap-2 px-1.5 text-sm text-ink-muted">${icon('description', 'h-4 w-4')}Description</div>
                    </div>
                    <div data-peek-slot="desc"></div>
                  </div>
                </div>
                <div data-peek-fade class="flex shrink-0 items-center justify-between gap-2 border-t border-line px-4 py-3 sm:px-6">
                  <div>${modal?.mode === 'edit' && !readOnly ? `<button type="button" data-delete-event class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm text-red-400 hover:bg-red-400/10">${icon('trash', 'h-4 w-4')}Delete</button>` : ''}</div>
                  <div class="flex gap-2">
                    <button type="button" data-close-modal class="rounded-xl border border-line px-5 py-2.5 text-sm hover:bg-white/5">${readOnly ? 'Close' : 'Cancel'}</button>
                    ${readOnly ? '' : '<button type="submit" form="schedule-form" class="rounded-xl bg-white px-5 py-2.5 text-sm font-medium text-black hover:bg-white/90">Save</button>'}
                  </div>
                </div>
              </div>
            </div>`;
        }

        /** Moves a real form element into the page, leaving a same-sized placeholder so the form's layout doesn't jump. */
        function moveIntoPeek(node, slot) {
          const placeholder = document.createElement('div');
          placeholder.style.height = `${node.getBoundingClientRect().height}px`;
          placeholder.style.marginBottom = getComputedStyle(node).marginBottom;
          node.replaceWith(placeholder);
          slot.append(node);
          // Fields that leave the <form> element still belong to it, so saving reads their values.
          (node.matches('input') ? [node] : [...node.querySelectorAll('input')]).forEach((input) => input.setAttribute('form', 'schedule-form'));
          return { node, placeholder };
        }

        /** Grow from (or shrink back to) the description box: the page is revealed through a clip that morphs, so text never stretches.
            The panel's colour and the box's own fill/border cross-fade at the same time, so nothing flashes. */
        function animatePeek(rect, opening) {
          const { overlay, panel, colors } = peek;
          const to = panel.getBoundingClientRect();
          const inset = (r) => `inset(${Math.max(0, r.top - to.top)}px ${Math.max(0, to.right - r.right)}px ${Math.max(0, to.bottom - r.bottom)}px ${Math.max(0, r.left - to.left)}px round 12px)`;
          const small = inset(rect);
          const full = 'inset(0px 0px 0px 0px round 16px)';
          const duration = reducedMotion() ? 0 : PEEK_MS;
          const ease = 'cubic-bezier(0.22, 1, 0.36, 1)';
          const pair = (a, b) => (opening ? [a, b] : [b, a]);
          const animations = [
            overlay.animate(pair({ opacity: 0 }, { opacity: 1 }), { duration, easing: 'ease', fill: 'both' }),
            panel.animate(pair(
              { clipPath: small, backgroundColor: colors.boxBg }, { clipPath: full, backgroundColor: colors.panelBg }),
              { duration, easing: ease, fill: 'both' }),
            // Everything except the description fades in slightly late (out early), so it doesn't pop up inside the clip.
            ...[...panel.querySelectorAll('[data-peek-fade]')].map((node) => node.animate(pair({ opacity: 0 }, { opacity: 1 }),
              opening ? { duration: duration * 0.7, delay: duration * 0.3, easing: 'ease', fill: 'both' } : { duration: duration * 0.5, easing: 'ease', fill: 'both' })),
          ];
          return Promise.all(animations.map((a) => a.finished)).then(() => {
            if (opening) animations.forEach((a) => a.cancel()); // release the clip so the panel's shadow shows again
          }).catch(() => {});
        }

        function openPeek({ focusEditor = false } = {}) {
          if (peek && !peekAlive()) peek = null;
          if (peek) return;
          const box = el.querySelector('[data-desc-box]');
          if (!box) return;
          const from = box.getBoundingClientRect();
          const colors = { boxBg: getComputedStyle(box).backgroundColor };
          el.insertAdjacentHTML('beforeend', peekMarkup());
          const overlay = el.querySelector('[data-peek-overlay]');
          const panel = overlay.querySelector('[data-peek-panel]');
          const slot = (key) => overlay.querySelector(`[data-peek-slot="${key}"]`);
          const moved = [];
          const title = el.querySelector('#field-title');
          if (title) moved.push(moveIntoPeek(title, slot('title')));
          PEEK_FIELDS.forEach(([key, , , selector]) => {
            const node = el.querySelector(selector);
            if (node) moved.push(moveIntoPeek(node, slot(key)));
          });
          const descMove = moveIntoPeek(box, slot('desc'));
          moved.push(descMove);
          peek = { overlay, panel, moved, box, descPlaceholder: descMove.placeholder, colors, closing: false };
          syncEditor();
          const editor = editorEl();
          if (focusEditor && editor) {
            editor.focus({ preventScroll: true });
            const range = document.createRange();
            range.selectNodeContents(editor);
            range.collapse(false);
            const selection = getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
          } else {
            panel.focus({ preventScroll: true });
          }
          colors.panelBg = getComputedStyle(panel).backgroundColor;
          animatePeek(from, true);
        }

        async function closePeek({ restoreFocus = true } = {}) {
          if (!peek) return;
          if (!peekAlive()) { peek = null; return; }
          if (peek.closing) return;
          peek.closing = true;
          const { overlay, moved, descPlaceholder } = peek;
          if (panelMode) closePanel({ restore: false });
          document.activeElement?.blur?.(); // open dropdowns close on blur before their fields move back
          await animatePeek(descPlaceholder.getBoundingClientRect(), false);
          moved.forEach(({ node, placeholder }) => { if (placeholder.isConnected) placeholder.replaceWith(node); });
          overlay.remove();
          peek = null;
          syncEditor();
          if (restoreFocus) el.querySelector('[data-peek-open]')?.focus({ preventScroll: true });
        }

        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-peek-open]')) return openPeek();
          if (!peekAlive()) return;
          if (e.target.closest('[data-peek-close]') || e.target.matches('[data-peek-overlay]')) return closePeek();
          if (e.target.closest('[data-peek-copy]')) {
            const link = el.querySelector('input[name="link"]')?.value.trim();
            if (link) navigator.clipboard?.writeText(link).then(() => actions.showToast('Meeting link copied'), () => {});
          }
        });

        el.addEventListener('keydown', (e) => {
          // Ctrl/Cmd+Enter toggles the expanded page, like Notion's "Open in full page".
          if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            if (peekAlive()) { e.preventDefault(); closePeek(); }
            else if (e.target.closest?.('[data-rich-editor]')) { e.preventDefault(); openPeek({ focusEditor: true }); }
            return;
          }
          if (!peekAlive()) return;
          if (e.target.id === 'field-title' && e.key === 'Enter') { e.preventDefault(); editorEl()?.focus(); return; }
          if (e.key === 'Tab') { // keep keyboard focus inside the page while it is open
            const focusable = [...peek.panel.querySelectorAll('button, a[href], input, [tabindex="0"], [contenteditable="true"]')]
              .filter((node) => !node.disabled && node.type !== 'hidden' && node.tabIndex >= 0 && node.offsetParent !== null);
            if (!focusable.length) return;
            const i = focusable.indexOf(document.activeElement);
            const next = focusable[(i + (e.shiftKey ? -1 : 1) + focusable.length) % focusable.length];
            if (i === -1 || (e.shiftKey && i === 0) || (!e.shiftKey && i === focusable.length - 1)) { e.preventDefault(); next.focus(); }
          }
        });

        // Escape collapses the page first (capture phase, so the dialog underneath is not closed too).
        // Inside the link/Drive box, Escape only closes that box, as before.
        document.addEventListener('keydown', (e) => {
          if (e.key !== 'Escape' || !peekAlive() || e.target.closest?.('[data-rich-panel]')) return;
          if (el.querySelector('[data-confirm-overlay]')) return; // the delete prompt closes first
          if (e.target.getAttribute?.('aria-expanded') === 'true') return; // an open date/time/purpose list closes first
          e.stopPropagation();
          closePeek();
        }, true);

        // Escape closes the dialog from anywhere.
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && store.getState().modal) actions.closeModal();
        });
      },
    };

    /* ---------- 7.8 Toast ---------- */
    const ToastModule = {
      id: 'toast',
      slot: '#slot-toast',
      deps: (s) => [s.toast],
      render: (state) => state.toast
        ? `<div class="rounded-xl bg-white px-4 py-3 text-sm font-medium text-black shadow-lg">${esc(state.toast.message)}</div>`
        : '',
    };

    /* ---------- 7.9 Pages ---------- */

    /** The calendar page is static HTML; this module only toggles its visibility by route. */
    const CalendarPageModule = { id: 'page-calendar', slot: '#page-calendar', route: 'calendar' };

    /** Home: a real page module that reuses selectors. Shows today's agenda. */
    const HomePageModule = {
      id: 'page-home',
      slot: '#page-home',
      createIn: '#slot-pages',
      slotClass: 'h-full overflow-auto rounded-2xl bg-surface p-6 sm:p-8',
      route: 'home',
      deps: (s) => [s.events, s.accounts, s.now],
      render(state) {
        const calendars = Selectors.calendarMap(state);
        const todayEvents = Selectors.eventsByDate(state).get(DateUtils.toKey(state.now)) ?? [];

        const agenda = todayEvents.length
          ? `<ul class="mt-6 flex max-w-xl flex-col gap-2">
              ${todayEvents.map((event) => `
                <li class="flex items-center gap-4 rounded-xl bg-surface-raised px-4 py-3">
                  <span class="h-8 w-1.5 shrink-0 rounded-full" style="background:${esc(calendars.get(event.calendarId)?.color ?? '#888')}"></span>
                  <span class="min-w-0 flex-1">
                    <span class="block truncate text-sm font-medium">${esc(event.title)}</span>
                    <span class="block text-xs text-ink-muted">${DateUtils.formatRange(event)}</span>
                  </span>
                </li>`).join('')}
            </ul>`
          : `<div class="mt-6 max-w-xl rounded-xl border border-dashed border-line p-6 text-sm text-ink-muted">
              Nothing is due today.
              <button type="button" data-action="new" class="ml-1 text-accent underline underline-offset-4">Add a task</button>
            </div>`;

        return `
          <h1 class="text-2xl">Today</h1>
          <p class="text-sm text-ink-muted">${DateUtils.formatAgendaDate(state.now)}</p>
          ${agenda}`;
      },
      bind(el, { actions }) {
        el.addEventListener('click', (e) => {
          if (e.target.closest('[data-action="new"]')) actions.openNewSchedule();
        });
      },
    };

    /**
     * Factory function: one function that makes many similar modules.
     * Use this pattern whenever you'd otherwise copy-paste a module.
     */
    function createPlaceholderPage({ route, title, description }) {
      return {
        id: `page-${route}`,
        slot: `#page-${route}`,
        createIn: '#slot-pages',
        slotClass: 'flex h-full flex-col items-center justify-center gap-2 rounded-2xl bg-surface p-8 text-center',
        route,
        deps: () => [],
        render: () => `
          <h1 class="text-2xl">${esc(title)}</h1>
          <p class="max-w-sm text-sm text-ink-muted">${esc(description)}</p>`,
      };
    }

    /* ================================================================
       8. BOOTSTRAP: wire everything together
       ================================================================ */
    function bootstrap() {
      const store = createStore(createInitialState());
      const actions = createActions(store);
      const ctx = { store, actions }; // handed to every module

      // >>> ADD NEW MODULES TO THIS LIST <<<
      ModuleRegistry.register(
        RailModule,
        WorkspaceModule,
        MiniCalendarModule,
        TodoModule,
        AccountsModule,
        CalendarPageModule,
        CalendarHeaderModule,
        CalendarBodyModule,
        HomePageModule,
        createPlaceholderPage({ route: 'tasks',    title: 'Tasks',    description: 'Your task list will live here. Register a new module to build it.' }),
        createPlaceholderPage({ route: 'timer',    title: 'Timer',    description: 'A focus timer can live here. Register a new module to build it.' }),
        createPlaceholderPage({ route: 'settings', title: 'Settings', description: 'Preferences will live here. Register a new module to build it.' }),
        AccountMenuModule,
        AuthModalModule,
        ModalModule,
        ToastModule,
      );

      // Save only when the data we care about actually changed.
      const trackedRefs = (s) => [s.events, s.accounts, s.users, s.activeUserId];
      const buildSnapshot = (s) => ({
        auth: { users: s.users, activeUserId: s.activeUserId },
        workspaces: stashWorkspace(s),
      });
      let lastRefs = trackedRefs(store.getState());
      store.subscribe((state) => {
        const refs = trackedRefs(state);
        if (refs.some((ref, i) => ref !== lastRefs[i])) {
          lastRefs = refs;
          Persistence.save(buildSnapshot(state));
        }
      });

      // Global listeners for the auth popups (Escape to close, close menu on resize).
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const { loginModal, accountMenu } = store.getState();
        if (loginModal) actions.closeLogin();
        else if (accountMenu) actions.closeAccountMenu();
      });
      window.addEventListener('resize', () => {
        if (store.getState().accountMenu) actions.closeAccountMenu();
      });

      ModuleRegistry.mountAll(ctx);
      actions.startGoogleSync(); // background sync: poll, refocus, month navigation
      if (CONFIG.OPEN_LOGIN_ON_LAUNCH && !store.getState().users.length) actions.openLogin('signin');
      setInterval(actions.tick, CONFIG.TICK_INTERVAL_MS); // move the "now" line
    }

    bootstrap();
  })();
  </script>
</body>
</html>
