<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskly</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />

  <!--
    ============================================================
    FONT: Google Sans
    ============================================================
    - `preconnect` opens the network connection early, so the font
      file starts downloading sooner (a small but real speed win).
    - `display=swap` shows fallback text immediately, then swaps in
      Google Sans when it arrives (prevents invisible text).
    - Only the weights we actually use (400/500/700) are requested.
      Every extra weight is extra bytes for the visitor.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet" />

  <!--
    ============================================================
    AUTH: Google Identity Services
    ============================================================
    Google's official sign-in library. `async defer` lets the page
    render without waiting for it. The code checks that it has loaded
    (GoogleAuth.isLoaded) before trying to use it.
  -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!--
    ============================================================
    STYLING: Tailwind CSS (Play CDN)
    ============================================================
    Tailwind is "utility-first": instead of writing custom CSS, you
    compose small single-purpose classes right in the markup
    (e.g. `rounded-2xl bg-surface p-4`).

    NOTE: The Play CDN is perfect for prototypes and learning. For a
    production site, install Tailwind via its CLI/build step so the
    CSS is pre-compiled, smaller, and cached.
  -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /*
      Design tokens live in ONE place: the Tailwind config.
      Need to re-theme the app? Change a value here, not in 200 places.
      Use semantic names ("surface", "ink") rather than literal ones
      ("dark-gray") so the meaning survives a redesign.
    */
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            // Fallback stack: if Google Sans fails to load, the browser
            // walks down this list until it finds a font that exists.
            sans: ['"Google Sans"', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            canvas: '#09090a',                       // page background
            surface: {
              DEFAULT: '#161617',                    // panels
              raised: '#1e1e20',                     // buttons, headers inside panels
              sunken: '#101011',                     // inputs, segmented controls
            },
            line: '#2a2a2e',                         // borders and dividers
            ink: {
              DEFAULT: '#f4f4f5',                    // primary text
              muted: '#a1a1a6',                      // secondary text
              faint: '#6b6b70',                      // disabled / out-of-range text
            },
            accent: '#d6ff3d',                       // brand highlight
          },
        },
      },
    };
  </script>

  <!--
    A tiny base stylesheet. Tailwind handles component styling; this
    block only covers global concerns that utilities can't express well:
    keyboard focus rings, scrollbars, and reduced-motion preferences.
  -->
  <style>
    :root { color-scheme: dark; --grid-line: #2a2a2e; }

    /* Visible keyboard focus is an accessibility requirement, not decoration. */
    :focus-visible { outline: 2px solid #d6ff3d; outline-offset: 2px; }

    * { scrollbar-width: thin; scrollbar-color: #3a3a3f transparent; }

    /* Still scrollable (wheel, touch, keyboard), but without a scrollbar that would eat into the layout. */
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }

    /* Account switcher stays pinned at the top of the sidebar; the modules below scroll under it and fade out. */
    .sticky-fade { position: sticky; top: 0; z-index: 10; }
    .sticky-fade::before {
      content: ''; position: absolute; z-index: -1; pointer-events: none; inset: 0 0 -20px 0;
      background: linear-gradient(to bottom, #09090a calc(100% - 20px), rgb(9 9 10 / 0));
    }

    /* Description editor: Tailwind's reset removes list bullets and link colours, so restore them here. */
    [data-rich-editor] { white-space: pre-wrap; overflow-wrap: anywhere; }
    [data-rich-editor][data-empty="true"]::before { content: attr(data-placeholder); color: #6b6b70; pointer-events: none; }
    [data-rich-editor] ul { list-style: disc; padding-left: 1.25rem; }
    [data-rich-editor] ol { list-style: decimal; padding-left: 1.25rem; }
    [data-rich-editor] a { color: #d6ff3d; text-decoration: underline; text-underline-offset: 2px; cursor: text; }
    [data-rich-toolbar] button[aria-pressed="true"] { background: rgb(255 255 255 / 0.12); color: #f4f4f5; }

    /* Expanded (Notion-style) schedule page: the description box is reused inside it, so restyle it there. */
    [data-peek-panel] #field-title { margin-bottom: 0; font-size: 2.25rem; font-weight: 700; line-height: 1.2; }
    [data-peek-panel] [data-rich-editor] { max-height: none; min-height: 16rem; font-size: 0.9375rem; }

    /* To-do list module (sidebar). Expand/collapse and completion are pure CSS transitions driven by data attributes. */
    .todo-collapse { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 280ms ease; }
    .todo-collapse[data-closed] { grid-template-rows: 0fr; }
    .todo-collapse > div { min-height: 0; min-width: 0; overflow: hidden; }
    .todo-collapse[data-closed] > div { visibility: hidden; transition: visibility 0s 280ms; }
    .todo-item { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 300ms ease, opacity 300ms ease, transform 300ms ease; }
    .todo-item > div { min-height: 0; overflow: hidden; }
    .todo-item[data-leaving] { grid-template-rows: 0fr; opacity: 0; transform: translateX(14px); pointer-events: none; }
    .todo-title { text-decoration: line-through; text-decoration-color: transparent; transition: text-decoration-color 250ms, opacity 250ms; }
    .todo-item[data-done] .todo-title { text-decoration-color: currentColor; opacity: 0.55; }
    .todo-check { border-color: var(--task-color); transition: background-color 200ms, border-color 200ms, transform 200ms; }
    .todo-check svg { opacity: 0; transform: scale(0.4); transition: opacity 150ms, transform 300ms cubic-bezier(0.34, 1.56, 0.64, 1); }
    .todo-item[data-done] .todo-check { background: var(--task-color); color: #09090a; }
    .todo-item[data-done] .todo-check svg { opacity: 1; transform: scale(1); }
    .todo-check:active { transform: scale(0.9); }
    [aria-expanded="false"] > .todo-chev { transform: rotate(-90deg); }
    .todo-chev { transition: transform 200ms; }

    /* Read-only tasks (synced from Google): the fields look locked and the description box is drawn dashed. */
    .ro-field { cursor: not-allowed; }
    .ro-field:not([data-desc-box]) { opacity: 0.6; }
    [data-desc-box].ro-field { border-style: dashed; background: transparent; cursor: default; }
    [data-desc-box].ro-field [data-rich-editor] { cursor: default; }
    input:disabled, button:disabled { cursor: not-allowed; }

    /* Small dark tooltip, like Notion's "Open in full page  Ctrl+Enter" chip. */
    [data-tip] { position: relative; }
    [data-tip]:hover::after, [data-tip]:focus-visible::after {
      content: attr(data-tip); position: absolute; top: calc(100% + 6px); right: 0; z-index: 70;
      white-space: pre; pointer-events: none; padding: 6px 9px; border-radius: 8px;
      background: #0c0c0d; border: 1px solid #2a2a2e; color: #f4f4f5; font-size: 12px; line-height: 1.35; text-align: left;
      box-shadow: 0 8px 24px rgb(0 0 0 / 0.5);
    }
    [data-tip][data-tip-align="left"]:hover::after, [data-tip][data-tip-align="left"]:focus-visible::after { right: auto; left: 0; }

    /* Respect users who ask their OS to minimise animation. */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>

<body class="h-full bg-canvas font-sans text-ink antialiased">

  <!--
    ============================================================
    APP SHELL
    ============================================================
    The HTML is only a skeleton of named "slots" (elements whose id
    starts with `slot-`). Each slot is owned by exactly one JavaScript
    module (see the MODULES section below), which fills it with markup.

    Layout is mobile-first: a column on small screens, a row from the
    `md:` breakpoint up. The `lg:` breakpoint reveals the sidebar.
  -->
  <div id="app" class="flex h-full flex-col gap-3 p-3 md:flex-row">

    <!-- Slot: primary navigation rail -->
    <nav id="slot-rail" aria-label="Primary"
         class="flex shrink-0 flex-row items-center gap-2 rounded-2xl bg-surface p-2 md:w-[4.5rem] md:flex-col md:py-4"></nav>

    <!-- Sidebar: hidden on small screens, visible on large ones -->
    <aside class="no-scrollbar hidden w-72 shrink-0 flex-col gap-3 overflow-y-auto lg:flex" aria-label="Calendar tools">
      <div id="slot-workspace" class="sticky-fade"></div>
      <div id="slot-mini-calendar"></div>
      <div id="slot-todo"></div>
      <div id="slot-accounts" class="flex flex-col gap-3"></div>
    </aside>

    <!-- Main area: every "page" module mounts inside #slot-pages -->
    <main id="slot-pages" class="min-h-0 min-w-0 flex-1">

      <!-- The calendar page has a static shell so its scroll position
           survives re-renders (only the inner slots get re-rendered). -->
      <section id="page-calendar" class="flex h-full flex-col overflow-hidden rounded-2xl bg-surface">
        <header id="slot-calendar-header" class="shrink-0"></header>
        <div id="slot-calendar-body" class="min-h-0 flex-1 overflow-auto border-t border-line"></div>
      </section>

    </main>
  </div>

  <!-- Overlays live outside #app so they can cover the whole viewport -->
  <div id="slot-account-menu"></div>
  <div id="slot-auth-modal"></div>
  <div id="slot-modal"></div>
  <div id="slot-toast" aria-live="polite"
       class="pointer-events-none fixed inset-x-0 bottom-6 z-[60] flex justify-center px-4"></div>


  <script>
  /* ==================================================================
     Taskly: ARCHITECTURE OVERVIEW
     ==================================================================
     This file is organised into numbered sections. Each has ONE job
     ("separation of concerns"), which is what makes a codebase easy to
     grow:

       1. CONFIG      Constants. No magic numbers scattered around.
       2. UTILITIES   Pure helper functions (dates, escaping, icons).
       3. STORE       The single source of truth for app state.
       4. SELECTORS   Read-only functions that derive data from state.
       5. ACTIONS     The ONLY functions that change state.
       5b. GOOGLE CAL  Two-way sync between Taskly and the user's Google Calendar.
       6. REGISTRY    Mounts modules and keeps them in sync with state.
       7. MODULES     Self-contained UI pieces (rail, calendar, modal...).
       8. BOOTSTRAP   Wires everything together and starts the app.

     DATA FLOW (one direction, easy to debug):

       user clicks  ->  Action  ->  Store updates  ->  Modules re-render

     ------------------------------------------------------------------
     HOW TO ADD A NEW MODULE (3 steps)
     ------------------------------------------------------------------
       1. Write a module object:

            const MyModule = {
              id:   'my-module',          // unique, kebab-case
              slot: '#slot-my-module',    // where it mounts
              deps: (state) => [state.events],       // re-render only when these change
              render: (state, ctx) => `<p>Hello</p>`, // returns an HTML string
              bind: (el, ctx) => { ... },            // optional: attach event listeners ONCE
            };

       2. Add it to the list in the BOOTSTRAP section.
       3. (Optional) Need a whole new page? Add `route`, `createIn` and
          `slotClass` (see createPlaceholderPage) and no HTML edits are needed.

     NAMING CONVENTIONS USED HERE
       - UPPER_SNAKE_CASE  constants           (CONFIG, ICON_PATHS)
       - PascalCase        module objects      (MiniCalendarModule)
       - camelCase         functions/variables (renderTimeGrid)
       - kebab-case        HTML ids            (slot-mini-calendar)
       - data-* attributes are the "hooks" JavaScript uses to find
         elements, so styling classes can change without breaking logic.
     ================================================================== */

  (() => {
    'use strict'; // Opt in to stricter, safer JavaScript rules.

    /* ================================================================
       1. CONFIG
       ================================================================ */
    /** Lets the app create, edit and delete events on the user's Google calendars. */
    const GOOGLE_CALENDAR_SCOPE = 'https://www.googleapis.com/auth/calendar.events';
/** Lets the app create, edit, complete and delete the user's Google Tasks (which also show up in Google Calendar). */
const GOOGLE_TASKS_SCOPE = 'https://www.googleapis.com/auth/tasks';
/** Lets the app see which calendars you subscribe to, so Google's holiday calendars can be shown. */
const GOOGLE_CALENDARLIST_SCOPE = 'https://www.googleapis.com/auth/calendar.calendarlist.readonly';

    const CONFIG = Object.freeze({
      LOCALE: 'en-US',
      HOUR_HEIGHT: 56,            // px height of one hour in the time grid
      GUTTER_WIDTH: '4.5rem',     // width of the hour-label column
      SNAP_MINUTES: 30,           // clicking the grid snaps to this interval
      DEFAULT_SCROLL_HOUR: 7,     // where the grid scrolls to on load
      TOAST_DURATION_MS: 3200,
      TICK_INTERVAL_MS: 60_000,   // how often the "now" line moves
      STORAGE_KEY: 'taskly.v1',
      EVENT_TEXT_COLOR: '#141414',

      // --- Authentication ---------------------------------------------
      // Create an "OAuth client ID" (type: Web application) in the Google
      // Cloud Console, add your site's origin (e.g. http://localhost:5500)
      // under "Authorised JavaScript origins", then paste the ID here.
      // A client ID is public by design, so it is safe in front-end code.
      GOOGLE_CLIENT_ID: '482114785955-l0l3piactqsn2hsv2i9qm4mij81t99de.apps.googleusercontent.com',
      GOOGLE_CALENDAR_SCOPE,
      GOOGLE_TASKS_SCOPE,
      // Asking for the calendar and tasks scopes at sign-in means ONE consent screen covers everything.
      GOOGLE_CALENDARLIST_SCOPE,
      GOOGLE_SCOPES: `openid email profile ${GOOGLE_CALENDAR_SCOPE} ${GOOGLE_TASKS_SCOPE} ${GOOGLE_CALENDARLIST_SCOPE}`,
      GOOGLE_USERINFO_URL: 'https://openidconnect.googleapis.com/v1/userinfo',

      // --- Google Calendar sync -------------------------------------------
      // OPTIONAL. Calendar requests are authorised by the signed-in user's OAuth
      // token, so no API key is needed. If you create one (Cloud Console >
      // APIs & Services > Credentials), paste it here to attribute requests to
      // your project, and restrict it to the Google Calendar API + your site.
      GOOGLE_API_KEY: '',

      // --- Google Drive attachments ---------------------------------------
      // The "Attach from Google Drive" button opens Google's own file picker.
      // To turn it on:
      //   1. Enable the "Google Picker API" in your Google Cloud project.
      //   2. Create a browser API key (restricted to the Picker API and your
      //      site) and paste it below.
      //   3. Add the .../auth/drive.file scope to your OAuth consent screen.
      // Taskly only sees the files you pick. Until a key is set, the button
      // falls back to pasting a Drive / Docs link.
      GOOGLE_PICKER_API_KEY: '',
      GOOGLE_DRIVE_SCOPE: 'https://www.googleapis.com/auth/drive.file',
      GOOGLE_CALENDAR_API: 'https://www.googleapis.com/calendar/v3',
      GOOGLE_TASKS_API: 'https://tasks.googleapis.com/tasks/v1', // the "Google Tasks API" must be enabled in your Cloud project
      GOOGLE_SYNC_INTERVAL_MS: 30_000, // how often Google is checked for changes (tab visible)
      GOOGLE_SYNC_MONTHS_BEFORE: 2,    // months before the viewed month that are kept in step
      GOOGLE_SYNC_MONTHS_AFTER: 4,     // months after the viewed month that are kept in step
      // Whether Google emails guests when a schedule with guests is saved:
      // 'none' (default), 'externalOnly' (non-Google guests) or 'all'.
      GOOGLE_SEND_INVITES: 'none',
      ACCOUNT_MENU_WIDTH: 288,     // px width of the account popup
      OPEN_LOGIN_ON_LAUNCH: false, // true = show the sign-in popup on first load
    });

    /* ================================================================
       2. UTILITIES (pure functions: same input -> same output)
       ================================================================ */

    /**
     * Escape text before putting it into an HTML string.
     * ALWAYS do this for anything a user can type. Skipping it allows
     * XSS (cross-site scripting) attacks.
     */
    const esc = (value) =>
      String(value ?? '').replace(/[&<>"']/g, (ch) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
      ));

    const pad2 = (n) => String(n).padStart(2, '0');

    const DateUtils = {
      startOfDay(date) {
        const d = new Date(date);
        d.setHours(0, 0, 0, 0);
        return d;
      },
      addDays(date, n) {
        const d = new Date(date);
        d.setDate(d.getDate() + n);
        return d;
      },
      firstOfMonth(date) {
        return new Date(date.getFullYear(), date.getMonth(), 1);
      },
      /** Move by whole months, clamping the day (Jan 31 + 1 month = Feb 28). */
      addMonthsClamped(date, n) {
        const target = new Date(date.getFullYear(), date.getMonth() + n, 1);
        const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
        target.setDate(Math.min(date.getDate(), lastDay));
        return target;
      },
      /** Weeks start on Monday, matching the design. */
      startOfWeek(date) {
        const d = DateUtils.startOfDay(date);
        return DateUtils.addDays(d, -((d.getDay() + 6) % 7));
      },
      /** "2026-09-29": a stable string key that is safe to store and compare. */
      toKey(date) {
        return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
      },
      fromKey(key) {
        const [y, m, d] = key.split('-').map(Number);
        return new Date(y, m - 1, d);
      },
      /** 750 -> "12:30 PM", 720 -> "12 PM" */
      formatTime(totalMinutes) {
        const hours24 = Math.floor(totalMinutes / 60) % 24;
        const minutes = totalMinutes % 60;
        const suffix = hours24 >= 12 ? 'PM' : 'AM';
        const hours12 = hours24 % 12 === 0 ? 12 : hours24 % 12;
        return minutes ? `${hours12}:${pad2(minutes)} ${suffix}` : `${hours12} ${suffix}`;
      },
      /** 990 -> "4:30 PM", 720 -> "12:00 PM", 1440 -> "12:00 AM" (always shows minutes; used in form fields). */
      formatTimeField(totalMinutes) {
        const hours24 = Math.floor(totalMinutes / 60) % 24;
        const hours12 = hours24 % 12 === 0 ? 12 : hours24 % 12;
        return `${hours12}:${pad2(totalMinutes % 60)} ${hours24 >= 12 ? 'pm' : 'am'}`;
      },
      /** "Tuesday, September 29": how a date is shown in the schedule form. */
      formatDateField: (d) => d.toLocaleDateString(CONFIG.LOCALE, { weekday: 'long', month: 'long', day: 'numeric' }),
      /** Label used wherever an event's time range is shown. */
      formatRange: (event) => event.allDay
        ? 'All day'
        : `${DateUtils.formatTime(event.start)} - ${DateUtils.formatTime(event.end)}`,
      formatMonthYear: (d) => d.toLocaleDateString(CONFIG.LOCALE, { month: 'long', year: 'numeric' }),
      formatWeekdayShort: (d) => d.toLocaleDateString(CONFIG.LOCALE, { weekday: 'short' }),
      formatLong: (d) => d.toLocaleDateString(CONFIG.LOCALE, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }),
      formatAgendaDate: (d) => d.toLocaleDateString(CONFIG.LOCALE, { weekday: 'long', month: 'long', day: 'numeric' }),
      minutesSinceMidnight: (d) => d.getHours() * 60 + d.getMinutes(),
      /** "GMT+8" (or "GMT+5:30") from the visitor's own timezone. */
      gmtLabel() {
        const offset = -new Date().getTimezoneOffset();
        const abs = Math.abs(offset);
        const minutes = abs % 60;
        return `GMT${offset >= 0 ? '+' : '-'}${Math.floor(abs / 60)}${minutes ? ':' + pad2(minutes) : ''}`;
      },
    };

    /**
     * Default time range for a new schedule: the closest :30 mark to `date`
     * (4:10 -> 4:30, 4:50 -> 4:30, 5:05 -> 5:30) and one hour after it.
     * Minutes since midnight; the end is capped at 24:00.
     */
    function closestHalfHourRange(date) {
      const now = DateUtils.minutesSinceMidnight(date);
      const start = Math.min(Math.max(Math.round((now - 30) / 60) * 60 + 30, 0), 23 * 60 + 30);
      return { start, end: Math.min(start + 60, 24 * 60) };
    }

    /**
     * Read a typed time and return minutes since midnight, or null if invalid.
     * Accepts 12-hour input with am/pm ("4:30pm", "4 PM", "4.30 p.m.") and
     * 24-hour input ("16:30", "1630", "930"). Input with no am/pm is read as
     * 24-hour ("16:30" = 4:30 PM, "4:30" = 4:30 AM). `hadSuffix` tells the
     * caller whether am/pm was typed, so it can make a smarter guess when it
     * wasn't. For an end time, midnight ("12am", "00:00", "24:00") means the
     * end of the day (1440), because an end can never be 0.
     */
    function parseTimeInput(raw, { allowEndOfDay = false } = {}) {
      const text = String(raw ?? '').trim().toLowerCase().replace(/\./g, '');
      const match = text.match(/^(\d{1,2})(\d{2})\s*(am|pm|a|p)?$/)                    // "430", "1630", "430pm"
        ?? text.match(/^(\d{1,2})(?:\s*[:h\s]\s*(\d{1,2}))?\s*(am|pm|a|p)?$/);      // "4", "4:30", "4 pm", "16h30"
      if (!match) return null;

      let hours = Number(match[1]);
      const minutes = match[2] === undefined ? 0 : Number(match[2]);
      const suffix = match[3]?.[0]; // 'a' | 'p' | undefined
      if (minutes > 59) return null;

      if (suffix) {
        if (hours < 1 || hours > 12) return null;
        hours = (hours % 12) + (suffix === 'p' ? 12 : 0);
      } else if (hours === 24 && minutes === 0 && allowEndOfDay) {
        return { minutes: 24 * 60, hadSuffix: false };
      } else if (hours > 23) {
        return null;
      }
      let total = hours * 60 + minutes;
      if (allowEndOfDay && total === 0) total = 24 * 60;
      return { minutes: total, hadSuffix: Boolean(suffix), typedHours: Number(match[1]) };
    }

    /**
     * Read a typed date and return a Date, or null if invalid. Accepts things
     * like "Sep 29", "september 29", "29 sep", "9/29", "9/29/27", "2026-09-29",
     * "Tuesday, September 29", "tue", "today" and "tomorrow". When no year is
     * typed, it picks the year that lands closest to `reference` (the date the
     * field held before), so "Jan 5" typed in late September means next January.
     */
    const MONTH_NAMES = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
    const WEEKDAY_NAMES = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    function parseDateInput(raw, reference, today = new Date()) {
      const nameIndex = (word, names) => (word.length >= 3 ? names.findIndex((n) => n.startsWith(word)) : -1);
      let text = String(raw ?? '').trim().toLowerCase()
        .replace(/[,.]/g, ' ').replace(/(\d)(st|nd|rd|th)\b/g, '$1').replace(/\s+/g, ' ').trim();
      if (!text) return null;

      const base = DateUtils.startOfDay(today);
      if (text === 'today') return base;
      if (text === 'tomorrow' || text === 'tmrw') return DateUtils.addDays(base, 1);
      if (text === 'yesterday') return DateUtils.addDays(base, -1);

      // Drop a leading weekday ("tuesday sep 29"); a lone weekday means its next occurrence.
      const words = text.split(' ');
      if (nameIndex(words[0], WEEKDAY_NAMES) >= 0 && nameIndex(words[0], MONTH_NAMES) < 0) {
        if (words.length === 1) {
          const target = nameIndex(words[0], WEEKDAY_NAMES);
          return DateUtils.addDays(base, (target - base.getDay() + 7) % 7);
        }
        text = words.slice(1).join(' ');
      }

      let month; let day; let year;
      let m;
      if ((m = text.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) {
        [year, month, day] = [Number(m[1]), Number(m[2]) - 1, Number(m[3])];
      } else if ((m = text.match(/^(\d{1,2})[-/.](\d{1,2})(?:[-/.](\d{4}|\d{2}))?$/))) {
        let [a, b] = [Number(m[1]), Number(m[2])];
        if (a > 12 && b <= 12) [a, b] = [b, a]; // "29/9" can only be day/month
        [month, day] = [a - 1, b];
        if (m[3]) year = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
      } else if ((m = text.match(/^([a-z]+) ?(\d{1,2})(?: (\d{4}|\d{2}))?$/)) && nameIndex(m[1], MONTH_NAMES) >= 0) {
        [month, day] = [nameIndex(m[1], MONTH_NAMES), Number(m[2])];
        if (m[3]) year = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
      } else if ((m = text.match(/^(\d{1,2}) ?([a-z]+)(?: (\d{4}|\d{2}))?$/)) && nameIndex(m[2], MONTH_NAMES) >= 0) {
        [month, day] = [nameIndex(m[2], MONTH_NAMES), Number(m[1])];
        if (m[3]) year = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
      } else {
        return null;
      }
      if (month < 0 || month > 11 || day < 1) return null;

      const build = (y) => {
        const d = new Date(y, month, day);
        return d.getMonth() === month && d.getDate() === day ? d : null; // rejects "Feb 30"
      };
      if (year !== undefined) return build(year);

      const ref = reference ?? base;
      const candidates = [ref.getFullYear() - 1, ref.getFullYear(), ref.getFullYear() + 1, ref.getFullYear() + 2]
        .map(build).filter(Boolean);
      if (!candidates.length) return null;
      return candidates.reduce((best, d) => (Math.abs(d - ref) < Math.abs(best - ref) ? d : best));
    }

    /** Unique id generator with a fallback for older browsers. */

      (window.crypto && crypto.randomUUID)

    const icon = (name, classes = 'h-5 w-5') =>
      `<svg class="${classes}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;

    /** Persist only what matters (events + accounts) to localStorage. */
    const Persistence = {
      load() {
        try {
          const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch { return null; } // Storage can be blocked; never crash because of it.
      },
      save(data) {
        try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(data)); } catch { /* ignore */ }
      },
    };

    /* ================================================================
       3. STORE: a tiny "publish/subscribe" state container
       ================================================================
       Rules that keep this predictable:
         - State is NEVER mutated. We always create new objects/arrays
           (`{...state}`, `[...list, item]`).
         - Because of that, modules can cheaply detect change by checking
           whether a reference is different (Object.is).
    */
    function createStore(initialState) {
      let state = initialState;
      const listeners = new Set();

      return {
        getState: () => state,
        /** Accepts an object patch OR a function (state) => patch. */
        setState(patch) {
          const next = typeof patch === 'function' ? patch(state) : patch;
          state = { ...state, ...next };
          listeners.forEach((listener) => listener(state));
        },
        subscribe(listener) {
          listeners.add(listener);
          return () => listeners.delete(listener); // call to unsubscribe
        },
      };
    }

    /**
     * What a schedule is for. Each purpose is a calendar (its colour and its
     * visibility toggle in the sidebar), and these three are what the
     * "purpose" dropdown in the schedule form offers.
     */
    const PURPOSES = Object.freeze([
      { id: 'personal', name: 'Personal', color: '#6f9bff' },
      { id: 'academic', name: 'Academic', color: '#d6ff3d' },
      { id: 'work',     name: 'Work',     color: '#ff6b6b' },
    ]);
    /** Holidays from Google Calendar live in their own read-only category: it appears in the legend but not in the purpose dropdown. */
const HOLIDAYS_CALENDAR = Object.freeze({ id: 'holidays', name: 'Holidays', color: '#f5a524' });
const createPurposeCalendars = () => [...PURPOSES.map((purpose) => ({ ...purpose, visible: true })), { ...HOLIDAYS_CALENDAR, visible: true }];

    /** Calendars from earlier versions of the app and the purpose that replaces each. */
    const LEGACY_PURPOSE = Object.freeze({ project: 'academic', freelance: 'work', focus: 'academic' });

    /**
     * Bring saved data from an older version up to date: the first account gets
     * the three purposes (keeping any on/off toggles the user set), and events
     * on retired calendars move to their replacement. Safe to run repeatedly.
     */
    function migrateWorkspace(workspace) {
      const accounts = workspace.accounts ?? [];
      if (!accounts.length) return workspace;
      const [first, ...rest] = accounts;
      const old = first.calendars ?? [];
      const wasVisible = (purposeId) => {
        const related = old.filter((c) => c.id === purposeId || LEGACY_PURPOSE[c.id] === purposeId);
        return related.length ? related.some((c) => c.visible) : true;
      };
      const purposeIds = new Set(PURPOSES.map((p) => p.id));
      const custom = old.filter((c) => !purposeIds.has(c.id) && !LEGACY_PURPOSE[c.id]);
      const calendars = [...PURPOSES.map((p) => ({ ...p, visible: wasVisible(p.id) })), ...custom];
      if (!calendars.some((c) => c.id === HOLIDAYS_CALENDAR.id)) calendars.push({ ...HOLIDAYS_CALENDAR, visible: true });
      return {
        ...workspace,
        accounts: [{ ...first, calendars }, ...rest],
        events: (workspace.events ?? []).map((e) =>
          LEGACY_PURPOSE[e.calendarId] ? { ...e, calendarId: LEGACY_PURPOSE[e.calendarId] } : e),
      };
    }

    /* ---------- Seed data (used on first visit only) ---------- */
    function createSeedAccounts() {
      return [
        {
          id: 'account-primary', email: 'you@gmail.com', expanded: true,
          calendars: createPurposeCalendars(),
        },
        {
          id: 'account-work', email: 'work@gmail.com', expanded: false,
          calendars: [{ id: 'team', name: 'Team calendar', color: '#b794ff', visible: true }],
        },
      ];
    }

    /** Calendars a newly signed-in user starts with (named after their email). */
    function createDefaultAccounts(email) {
      return [{
        id: 'account-primary', email, expanded: true,
        calendars: createPurposeCalendars(),
      }];
    }

        ({ id: createId(), title, date: at(dayOffset), start, end, calendarId, guests: [], link: '' });

      return [
        make(0, 'Project preparation',       h(8, 30), h(12, 30), 'academic'),

        make(2, '2025 portfolio planning',   h(13),    h(16),     'work'),
        make(3, 'Work from café',            h(8, 30), h(10, 30), 'personal'),
        make(3, 'Sketching & wireframing',   h(11),    h(15),     'academic'),
        make(4, 'Weekly design exploration', h(9, 30), h(14),     'work'),
        make(5, 'High-fidelity designing',   h(8, 30), h(12),     'academic'),
        make(5, 'Explore Schwarzwald',       h(13),    h(16),     'personal'),
        make(6, 'Work from café',            h(8, 30), h(11),     'work'),
        make(6, 'Lunch at the Barn Café',    h(11),    h(12, 30), 'personal'),

    function createInitialState() {
      const today = DateUtils.startOfDay(new Date());
      const saved = Persistence.load();

      // Only profile info is saved for users (name, email, picture). Google
      // access tokens are used once and thrown away, never stored.
      const users = saved?.auth?.users ?? [];
      const activeUserId = users.some((u) => u.id === saved?.auth?.activeUserId)
        ? saved.auth.activeUserId
        : (users[0]?.id ?? null);

      // Older saves kept events at the top level: treat those as the guest workspace.
      const workspaces = saved?.workspaces
        ?? (saved?.events ? { guest: { events: saved.events, accounts: saved.accounts } } : {});
      const current = loadWorkspace(workspaces, users, activeUserId);

      return {
        activeRoute: 'calendar',   // which page is visible
        view: 'month',            // 'day' | 'week' | 'month'
        currentDate: today,        // the date the calendar is focused on
        miniMonth: DateUtils.firstOfMonth(today), // month shown in the mini calendar
        now: new Date(),           // updated every minute for the "now" line

        // Authentication
        users,                     // [{ id, name, email, picture }]
        activeUserId,              // null = signed out ("guest")
        workspaces,                // cached data for users who are not active
        loginModal: null,          // null | { mode: 'signin' | 'add' }
        authLoading: false,        // true while the Google popup is open
        authError: '',
        accountMenu: null,         // null | { top, left, width } (popup position)

        // Data for the ACTIVE user
        accounts: current.accounts,
        events: current.events,

        modal: null,               // null | { mode: 'create' | 'edit', event }
        toast: null,               // null | { id, message }

        // Google Calendar sync (per active user; tokens are never stored)
        gcal: { status: 'off', lastSync: null, message: '' }, // status: 'off' | 'syncing' | 'synced' | 'error'
      };
    }

    /* ================================================================
       4. SELECTORS: derive data from state without changing it
       ================================================================ */
    const Selectors = {
      activeUser: (state) => state.users.find((user) => user.id === state.activeUserId) ?? null,
      allCalendars: (state) => state.accounts.flatMap((account) => account.calendars),
      calendarMap: (state) => new Map(Selectors.allCalendars(state).map((cal) => [cal.id, cal])),
      /** Only events whose calendar is switched on. */
      visibleEvents(state) {
        const calendars = Selectors.calendarMap(state);
        return state.events.filter((event) => calendars.get(event.calendarId)?.visible);
      },
      /** Map of 'YYYY-MM-DD' -> events sorted by start time. */
      eventsByDate(state) {
        const map = new Map();
        Selectors.visibleEvents(state).forEach((event) => {
          if (!map.has(event.date)) map.set(event.date, []);
          map.get(event.date).push(event);
        });
        map.forEach((list) => list.sort((a, b) => a.start - b.start || a.end - b.end));
        return map;
      },
    };

    /**
     * Side-by-side layout for overlapping events ("lanes").
     * Returns [{ event, lane, lanes }] so the UI can compute left/width.
     */
    function layoutOverlaps(events) {
      const sorted = [...events].sort((a, b) => a.start - b.start || b.end - a.end);
      const result = [];
      let cluster = [];
      let clusterEnd = -1;

      const flushCluster = () => {
        const laneEnds = [];
        const placed = cluster.map((event) => {
          let lane = laneEnds.findIndex((end) => end <= event.start);
          if (lane === -1) { lane = laneEnds.length; laneEnds.push(event.end); }
          else { laneEnds[lane] = event.end; }
          return { event, lane };
        });
        placed.forEach((item) => result.push({ ...item, lanes: laneEnds.length }));
        cluster = [];
      };

      sorted.forEach((event) => {
        if (cluster.length && event.start >= clusterEnd) flushCluster();
        cluster.push(event);
        clusterEnd = cluster.length === 1 ? event.end : Math.max(clusterEnd, event.end);
      });
      flushCluster();
      return result;
    }

    /* ================================================================
       CALENDAR VIEW REGISTRY
       ================================================================
       Views (Day / Week / Month) are plugins too. Register a new one and
       the header's view switcher picks it up automatically. Each view
       provides a label, a render(state) function, and how to step
       forward/back in time.
    */
    const CalendarViews = {};
    const registerCalendarView = (id, definition) => { CalendarViews[id] = definition; };
    const getWeekDays = (date) => {
      const start = DateUtils.startOfWeek(date);
      return Array.from({ length: 7 }, (_, i) => DateUtils.addDays(start, i));
    };

    /* ================================================================
       5. ACTIONS: the only code allowed to change state
       ================================================================ */
    /* ---------- Per-user workspaces ----------
       Each signed-in user gets their own events and calendars. When the
       active user changes, we stash the current data and load the target's.
       "guest" is the signed-out workspace (it keeps the demo data). */
    function stashWorkspace(state) {
      return { ...state.workspaces, [state.activeUserId ?? 'guest']: { events: state.events, accounts: state.accounts } };
    }

    function loadWorkspace(workspaces, users, userId) {
      const existing = workspaces[userId ?? 'guest'];
      if (existing) return migrateWorkspace(existing);
      const user = users.find((u) => u.id === userId);
      return user
        ? { events: [], accounts: createDefaultAccounts(user.email) }
        : { events: createSeedEvents(DateUtils.startOfWeek(new Date())), accounts: createSeedAccounts() };
    }

    /** Builds the state patch that makes `userId` the active user. */
    function buildSwitchPatch(state, users, userId) {
      const workspaces = stashWorkspace(state);
      const target = loadWorkspace(workspaces, users, userId);
      return { users, workspaces, activeUserId: userId, events: target.events, accounts: target.accounts };
    }

    /* ---------- Google sign-in (Google Identity Services) ----------
       We use the "token client": it opens Google's own account-chooser
       popup and hands back a short-lived access token. We use that token
       once to read the profile from Google's userinfo endpoint. */
    const GoogleAuth = {
      isConfigured: () => Boolean(CONFIG.GOOGLE_CLIENT_ID) && !CONFIG.GOOGLE_CLIENT_ID.startsWith('YOUR_'),
      isLoaded: () => Boolean(window.google?.accounts?.oauth2),

      /**
       * Resolves with { profile: { id, name, email, picture }, grant: { accessToken, expiresIn, calendar } }.
       * `calendar` is false if the user unticked the calendar permission. Must be called from a click handler.
       */
      requestProfile() {
        return new Promise((resolve, reject) => {
          const client = google.accounts.oauth2.initTokenClient({
            client_id: CONFIG.GOOGLE_CLIENT_ID,
            scope: CONFIG.GOOGLE_SCOPES,
            callback: async (response) => {
              if (response.error) return reject(new Error('Google sign-in failed. Please try again.'));
              try {
                const res = await fetch(CONFIG.GOOGLE_USERINFO_URL, {
                  headers: { Authorization: `Bearer ${response.access_token}` },
                });
                if (!res.ok) throw new Error('bad response');
                const profile = await res.json();
                resolve({
                  profile: { id: profile.sub, name: profile.name || profile.email, email: profile.email, picture: profile.picture || '' },
                  grant: {
                    accessToken: response.access_token,
                    expiresIn: response.expires_in,
                    calendar: google.accounts.oauth2.hasGrantedAllScopes(response, CONFIG.GOOGLE_CALENDAR_SCOPE, CONFIG.GOOGLE_TASKS_SCOPE, CONFIG.GOOGLE_CALENDARLIST_SCOPE),
                  },
                });
              } catch {
                reject(new Error('Could not load your Google profile. Please try again.'));
              }
            },
            error_callback: (err) => {
              const cancelled = err?.type === 'popup_closed';
              const error = new Error(cancelled ? 'Sign-in was cancelled.' : 'Google sign-in could not open. Allow pop-ups and try again.');
              error.cancelled = cancelled;
              reject(error);
            },
          });
          // `select_account` always shows the chooser, which is what "add account" needs.
          client.requestAccessToken({ prompt: 'select_account' });
        });
      },
    };

    /* ================================================================
       5b. GOOGLE CALENDAR SYNC
       ================================================================
       Taskly talks to the Google Calendar REST API (v3) directly with
       fetch(). No extra library is needed: the access token from Google
       sign-in goes in an Authorization header.

       HOW THE TWO CALENDARS STAY IN STEP
         Taskly -> Google   Saving or deleting a schedule sends that change
                            to the user's PRIMARY Google calendar right away.
         Google -> Taskly   Every 30 seconds (while the tab is visible), when
                            the tab regains focus, when you move to a month
                            that hasn't been loaded, and when you press Sync,
                            Taskly downloads the nearby events and updates
                            itself to match (adds, edits and deletions).

       HOW A SCHEDULE MAPS TO A GOOGLE EVENT
         title, date, time, all-day, guests, description   the same field
         meeting link   ->  the event's "location" (Meet links are read too)
         purpose        ->  an event colour (Personal = blue, Academic =
                            yellow, Work = red) plus a hidden tag. Recolouring
                            an event in Google Calendar changes its purpose here.

       Events Taskly can't represent (multi-day, invitations you can't edit,
       birthdays...) are shown but opened in Google Calendar to edit.

       Access tokens live in memory only and last about an hour. When one
       runs out, the sidebar card and header button offer "Reconnect".
    */

    /** Google's event colour ids that best match each purpose. */
    const PURPOSE_COLOR_ID = Object.freeze({ personal: '9', academic: '5', work: '11' });

    /** Google event types Taskly shows. Others (birthdays, working location...) are skipped. */
    const SHOWN_GOOGLE_TYPES = new Set(['default', 'focusTime', 'outOfOffice', 'fromGmail']);
    const WEB_URL = /^https?:\/\//i;
    const MAX_SEGMENTS = 62; // longest multi-day event we will draw, in days

    /* ---------- Rich-text descriptions ----------
       A description is stored as a small, safe subset of HTML: <b> <i> <u>
       <ul> <ol> <li> <a href> <br>. That is exactly what Google Calendar
       understands, so formatting survives the round trip in both directions.
       Descriptions saved before this existed are plain text, and are converted on the way in. */
    const SAFE_URL = /^(https?:|mailto:)/i;
    const RICH_SKIP = new Set(['script', 'style', 'noscript', 'template', 'iframe', 'object', 'embed', 'meta', 'link', 'title', 'head', 'svg', 'canvas', 'textarea', 'select']);
    const RICH_BLOCK = new Set(['div', 'p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'blockquote', 'pre', 'section', 'article', 'header', 'footer', 'table', 'tbody', 'tr']);

    /**
     * Reduce ANY html (typed, pasted, or downloaded from Google) to the safe subset above.
     * This is the security boundary: output is rebuilt from an allow-list, and text and
     * URLs are escaped, so nothing from the input can reach the page as markup.
     */
    function sanitizeRichText(html) {
      const doc = new DOMParser().parseFromString(String(html ?? ''), 'text/html'); // parsing never runs scripts
      const endsLine = (out) => out === '' || /(<br>|<\/ul>|<\/ol>)$/.test(out);

      function walk(parent) {
        let out = '';
        parent.childNodes.forEach((node) => {
          if (node.nodeType === 3) { out += esc(node.nodeValue.replace(/[\s\u00a0]+/g, ' ')); return; }
          if (node.nodeType !== 1) return;
          const tag = node.localName;
          if (RICH_SKIP.has(tag)) return;
          const style = (node.getAttribute('style') ?? '').toLowerCase();

          if (tag === 'br') { out += '<br>'; return; }
          if (tag === 'ul' || tag === 'ol') { const items = walk(node); if (items) out += `<${tag}>${items}</${tag}>`; return; }
          if (tag === 'li') { out += `<li>${walk(node).replace(/(<br>)+$/, '')}</li>`; return; }
          if (tag === 'a') {
            const href = (node.getAttribute('href') ?? '').trim();
            const body = walk(node);
            out += body && SAFE_URL.test(href) ? `<a href="${esc(href)}">${body}</a>` : body;
            return;
          }
          if (RICH_BLOCK.has(tag)) {
            const body = walk(node);
            if (!endsLine(out)) out += '<br>';            // a block starts on its own line
            out += body;
            if (!endsLine(out)) out += '<br>';            // ...and ends its line
            return;
          }

          // Everything else is inline. Bold/italic/underline may arrive as tags or as CSS (pasted content).
          let body = walk(node);
          if (!body) return;
          // Google Docs wraps pasted text in <b style="font-weight:normal">; that is NOT bold.
          const bold = tag === 'b' || tag === 'strong' ? !/font-weight:\s*(normal|[1-4]00)/.test(style) : /font-weight:\s*(bold|[6-9]00)/.test(style);
          const italic = tag === 'i' || tag === 'em' ? !/font-style:\s*normal/.test(style) : /font-style:\s*italic/.test(style);
          const underline = tag === 'u' || /text-decoration[^;]*underline/.test(style);
          if (underline) body = `<u>${body}</u>`;
          if (italic) body = `<i>${body}</i>`;
          if (bold) body = `<b>${body}</b>`;
          out += body;
        });
        return out;
      }

      const cleaned = walk(doc.body)
        .replace(/ *<br> */g, '<br>')
        .replace(/\s*(<\/?(?:ul|ol|li)>)\s*/g, '$1')
        .replace(/^(?:<br>|\s)+|(?:<br>|\s)+$/g, '')
        .replace(/(?:<br>){4,}/g, '<br><br><br>');
      return cleaned.replace(/<[^>]*>/g, '').trim() || /<li>/.test(cleaned) ? cleaned : '';
    }

    /** Any stored or downloaded description -> the safe HTML subset (plain text keeps its line breaks). */
    function descriptionToHtml(raw) {
      const source = String(raw ?? '');
      if (!source.trim()) return '';
      if (/<[a-z][\s\S]*>/i.test(source)) return sanitizeRichText(source);
      return sanitizeRichText(esc(source).replace(/\r?\n/g, '<br>'));
    }

    /* ---------- Attachments (Google Drive files) ---------- */
    const MAX_ATTACHMENTS = 25; // Google Calendar's limit per event

    /** One attachment in Taskly's shape, or null if it is not usable (only https links are kept). */
    function normalizeAttachment(a) {
      const fileUrl = String(a?.fileUrl ?? '').trim();
      if (!/^https:\/\//i.test(fileUrl)) return null;
      const iconLink = String(a?.iconLink ?? '').trim();
      return {
        fileUrl,
        title: String(a?.title ?? '').trim() || 'Untitled',
        mimeType: String(a?.mimeType ?? ''),
        fileId: String(a?.fileId ?? ''),
        iconLink: /^https:\/\//i.test(iconLink) ? iconLink : '',
      };
    }

    /** Read a pasted Google Drive / Docs / Sheets / Slides link. Returns null if it is not one. */
    function parseDriveLink(input) {
      let url;
      try { url = new URL(String(input ?? '').trim()); } catch { return null; }
      if (url.protocol !== 'https:' || !['docs.google.com', 'drive.google.com'].includes(url.hostname)) return null;
      const path = url.pathname;
      const fileId = path.match(/\/d\/([\w-]{10,})/)?.[1] ?? path.match(/\/folders\/([\w-]{10,})/)?.[1] ?? url.searchParams.get('id');
      if (!fileId || !/^[\w-]{10,}$/.test(fileId)) return null;
      const kinds = [
        ['/document/', 'document', 'application/vnd.google-apps.document', 'Google Doc'],
        ['/spreadsheets/', 'spreadsheets', 'application/vnd.google-apps.spreadsheet', 'Google Sheet'],
        ['/presentation/', 'presentation', 'application/vnd.google-apps.presentation', 'Google Slides'],
        ['/forms/', 'forms', 'application/vnd.google-apps.form', 'Google Form'],
      ];
      const kind = kinds.find(([segment]) => path.includes(segment));
      if (kind) return { fileId, fileUrl: `https://docs.google.com/${kind[1]}/d/${fileId}/edit`, mimeType: kind[2], title: kind[3] };
      if (path.includes('/folders/')) return { fileId, fileUrl: `https://drive.google.com/drive/folders/${fileId}`, mimeType: 'application/vnd.google-apps.folder', title: 'Drive folder' };
      return { fileId, fileUrl: `https://drive.google.com/open?id=${fileId}`, mimeType: '', title: 'Drive file' };
    }

    /** Which purpose (Taskly calendar) a Google event belongs to. */
    function purposeFromGoogle(item, validIds) {
      const byColor = Object.keys(PURPOSE_COLOR_ID).find((id) => PURPOSE_COLOR_ID[id] === item.colorId);
      const stored = item.extendedProperties?.private?.tasklyPurpose;
      const pick = [byColor, stored, 'personal'].find((id) => id && validIds.has(id));
      return pick ?? [...validIds][0] ?? 'personal';
    }

    function explainGoogleError(error) {
      const reason = String(error.reason ?? '');
      if (reason === 'accessNotConfigured' || reason === 'SERVICE_DISABLED') {
        return 'The Google Calendar API or Google Tasks API is not enabled for your Google Cloud project yet.';
      }
      if (reason.startsWith('API_KEY') || /API key/i.test(error.message)) {
        return 'Google rejected the API key. Check its restrictions, or leave GOOGLE_API_KEY empty.';
      }
      if (/rateLimit/i.test(reason)) return 'Google is rate-limiting requests. Sync will retry shortly.';
      if (error.status) return `Google Calendar returned an error (${error.status}). Sync will retry.`;
      return 'Could not reach Google Calendar. Check your connection.';
    }

    /* ---------- Tokens (memory only, never written to storage) ---------- */
    const GoogleCalendarAuth = {
      tokens: new Map(), // userId -> { token, expiresAt }

      /** The token if it is still good for at least a minute, otherwise null. */
      tokenFor(userId) {
        const entry = this.tokens.get(userId);
        return entry && entry.expiresAt - 60_000 > Date.now() ? entry.token : null;
      },
      remember(userId, token, expiresInSeconds) {
        this.tokens.set(userId, { token, expiresAt: Date.now() + (Number(expiresInSeconds) || 3600) * 1000 });
      },
      forget(userId) { this.tokens.delete(userId); },

      /**
       * Ask Google for a Calendar-scoped token. Must be called from a click
       * (it opens Google's popup). It also checks that the account chosen in
       * the popup is the one this workspace belongs to.
       * With `silent`, Google is asked not to show any UI: if the user is still signed in and
       * already granted access, a fresh token comes back on its own; otherwise it rejects.
       */
      request(user, { silent = false } = {}) {
        return new Promise((resolve, reject) => {
          if (silent) setTimeout(() => reject(new Error('Silent sign-in timed out.')), 10_000); // no-op once settled
          const client = google.accounts.oauth2.initTokenClient({
            client_id: CONFIG.GOOGLE_CLIENT_ID,
            scope: CONFIG.GOOGLE_SCOPES,
            hint: user.email,
            callback: async (response) => {
              if (response.error) return reject(new Error('Google Calendar access was not granted.'));
              if (!google.accounts.oauth2.hasGrantedAllScopes(response, CONFIG.GOOGLE_CALENDAR_SCOPE, CONFIG.GOOGLE_TASKS_SCOPE, CONFIG.GOOGLE_CALENDARLIST_SCOPE)) {
                return reject(new Error('Calendar, Tasks and calendar-list permissions were not ticked. Try again and allow them all.'));
              }
              try {
                const res = await fetch(CONFIG.GOOGLE_USERINFO_URL, {
                  headers: { Authorization: `Bearer ${response.access_token}` },
                });
                const profile = res.ok ? await res.json() : null;
                if (profile?.sub !== user.id) return reject(new Error(`Choose ${user.email} to sync this workspace.`));
              } catch {
                return reject(new Error('Could not verify your Google account. Please try again.'));
              }
              GoogleCalendarAuth.remember(user.id, response.access_token, response.expires_in);
              resolve(response.access_token);
            },
            error_callback: (err) => {
              const cancelled = err?.type === 'popup_closed';
              const error = new Error(cancelled ? 'Connection was cancelled.' : 'Google could not open its pop-up. Allow pop-ups and try again.');
              error.cancelled = cancelled;
              reject(error);
            },
          });
          client.requestAccessToken({ prompt: silent ? 'none' : '' });
        });
      },
    };

    /* ---------- The API + the two-way mapping ---------- */
    const GoogleCalendar = {
      /** Only real Google accounts sync; guests and demo users have no calendar to sync with. */
      eligible: (user) => Boolean(user) && !user.demo && GoogleAuth.isConfigured(),

      /**
       * Google lets us choose an event's id if it uses only 0-9 and a-v (5 to
       * 1024 characters). A Taskly id is a UUID, so removing the dashes gives a
       * valid one. Choosing the id ourselves means a retried "create" can never
       * make a duplicate.
       */
      idFor(taskId) {
        const candidate = String(taskId).replace(/-/g, '').toLowerCase();
        return /^[0-9a-v]{5,1024}$/.test(candidate) ? candidate : null;
      },

      /** One authenticated request. Errors carry `.status`, `.reason` and (when sign-in is the problem) `.code = 'auth'`. */
      async call(userId, path, { method = 'GET', query = {}, body, base = CONFIG.GOOGLE_CALENDAR_API } = {}) {
        const token = GoogleCalendarAuth.tokenFor(userId);
        if (!token) throw Object.assign(new Error('Not connected to Google Calendar.'), { code: 'auth' });

        const params = new URLSearchParams(query);
        if (CONFIG.GOOGLE_API_KEY) params.set('key', CONFIG.GOOGLE_API_KEY); // optional: see CONFIG
        const qs = params.toString();

        const response = await fetch(`${base}${path}${qs ? `?${qs}` : ''}`, {
          method,
          headers: { Authorization: `Bearer ${token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (response.ok) return response.status === 204 ? null : response.json();

        const detail = await response.json().catch(() => null);
        const error = new Error(detail?.error?.message ?? `Google Calendar error ${response.status}`);
        error.status = response.status;
        error.reason = detail?.error?.errors?.[0]?.reason ?? detail?.error?.details?.[0]?.reason ?? detail?.error?.status ?? '';
        if (response.status === 401 || error.reason === 'insufficientPermissions') error.code = 'auth';
        throw error;
      },

      /**
       * Google event -> a list of Taskly schedules (usually one). Taskly draws one
       * block per day, so a multi-day event becomes one read-only block per day.
       */
      fromEvent(item, validIds) {
        const type = item.eventType ?? 'default';
        if (item.status === 'cancelled' || !item.start || !item.end || !SHOWN_GOOGLE_TYPES.has(type)) return [];

        const attendees = (item.attendees ?? []).map(({ email, responseStatus, self, resource, organizer }) =>
          ({ email, responseStatus, self, resource, organizer }));
        if (attendees.some((a) => a.self && a.responseStatus === 'declined')) return []; // Google hides these too

        const raw = item.description ?? '';
        const text = descriptionToHtml(raw);
        const location = item.location ?? '';
        const isUrl = WEB_URL.test(location);
        const allDay = Boolean(item.start.date);
        const zeroLength = !allDay && new Date(item.end.dateTime) <= new Date(item.start.dateTime);

        // Which day(s) does it cover, and from when to when on each?
        const pieces = [];
        if (allDay) {
          const first = DateUtils.fromKey(item.start.date);
          const days = Math.max(1, Math.round((DateUtils.fromKey(item.end.date) - first) / 86_400_000)); // end date is exclusive
          for (let i = 0; i < Math.min(days, MAX_SEGMENTS); i += 1) {
            pieces.push({ date: DateUtils.toKey(DateUtils.addDays(first, i)), start: 0, end: 24 * 60 });
          }
        } else if (zeroLength) {
          const from = new Date(item.start.dateTime);
          const start = DateUtils.minutesSinceMidnight(from);
          pieces.push({ date: DateUtils.toKey(from), start, end: Math.min(start + 30, 24 * 60) });
        } else {
          const from = new Date(item.start.dateTime);
          const to = new Date(item.end.dateTime);
          const firstKey = DateUtils.toKey(from);
          const lastDay = DateUtils.startOfDay(new Date(to.getTime() - 1)); // ending at exactly midnight stays on the earlier day
          const lastKey = DateUtils.toKey(lastDay);
          for (let day = DateUtils.startOfDay(from); day <= lastDay && pieces.length < MAX_SEGMENTS; day = DateUtils.addDays(day, 1)) {
            const key = DateUtils.toKey(day);
            pieces.push({
              date: key,
              start: key === firstKey ? DateUtils.minutesSinceMidnight(from) : 0,
              end: key === lastKey ? (DateUtils.minutesSinceMidnight(to) || 24 * 60) : 24 * 60,
            });
          }
        }
        if (!pieces.length) return [];

        // Only plain, single-day events you own (or may modify) can be edited from Taskly.
        const editable = type === 'default'
          && (!item.organizer || item.organizer.self === true || item.guestsCanModify === true);
        const single = pieces.length === 1;
        const readOnly = !editable || !single || zeroLength;
        const htmlLink = readOnly && String(item.htmlLink ?? '').startsWith('https://') ? item.htmlLink : '';

        const shared = {
          gid: item.id, onGoogle: true, dirty: false, allDay, readOnly, htmlLink,
          title: item.summary || '(No title)',
          description: text,
          attachments: (item.attachments ?? []).map(normalizeAttachment).filter(Boolean),
          calendarId: purposeFromGoogle(item, validIds),
          guests: attendees.filter((a) => a.email && !a.self && !a.resource).map((a) => a.email),
          link: item.hangoutLink || (isUrl ? location : ''),
          // "Google extras": things Taskly has no field for, kept so an edit doesn't wipe them.
          gx: {
            place: isUrl ? '' : location,
            hangout: item.hangoutLink || '',
            descRaw: text === raw ? '' : raw,
            untitled: !item.summary,
            attendees,
          },
        };
        return pieces.map((piece) => ({ ...shared, ...piece, id: single ? item.id : `${item.id}~${piece.date}` }));
      },

      /** Taskly schedule -> the JSON Google expects. `patch` also clears the fields we are not using. */
      toBody(event, { patch }) {
        const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const at = (minutes) => {
          const d = DateUtils.fromKey(event.date);
          d.setMinutes(minutes); // 24:00 rolls over to midnight of the next day
          return d.toISOString();
        };
        const nextDay = DateUtils.toKey(DateUtils.addDays(DateUtils.fromKey(event.date), 1)); // all-day ends are exclusive
        const start = event.allDay ? { date: event.date } : { dateTime: at(event.start), timeZone: zone };
        const end = event.allDay ? { date: nextDay } : { dateTime: at(event.end), timeZone: zone };
        if (patch) {
          // A PATCH merges objects, so explicitly clear whichever form we are not using.
          const clear = event.allDay ? { dateTime: null, timeZone: null } : { date: null };
          Object.assign(start, clear);
          Object.assign(end, clear);
        }

        const gx = event.gx ?? {};
        const keepsFormatting = gx.descRaw && event.description === descriptionToHtml(gx.descRaw);
        const body = {
          summary: gx.untitled && event.title === '(No title)' ? '' : event.title,
          description: keepsFormatting ? gx.descRaw : (event.description ?? ''),
          location: event.link && event.link !== gx.hangout ? event.link : (gx.place ?? ''),
          start,
          end,
          extendedProperties: { private: { tasklyPurpose: event.calendarId } },
        };
        const colorId = PURPOSE_COLOR_ID[event.calendarId];
        if (colorId) body.colorId = colorId;
        else if (patch) body.colorId = null;

        // Keep the owner entry and each guest's reply; add anyone new by email.
        const known = gx.attendees ?? [];
        const attendees = [
          ...known.filter((a) => a.self || a.resource),
          ...(event.guests ?? []).map((email) => known.find((a) => a.email === email) ?? { email }),
        ];
        if (attendees.length || patch) body.attendees = attendees;

        // Drive files. Google reads the id from the link, so only link, name and type are sent.
        const attachments = (event.attachments ?? []).map(({ fileUrl, title, mimeType }) =>
          ({ fileUrl, title, ...(mimeType ? { mimeType } : {}) }));
        if (attachments.length || patch) body.attachments = attachments;
        return body;
      },
    };

    /* ---------- Google Tasks ----------
       New Taskly tasks are created as Google Tasks (they show up in Google Calendar's task list). Google Tasks only
       stores a title, notes, a due DATE and done/not done, so times, guests, links and attachments stay in Taskly. */
    function htmlToPlainText(html) {
      const doc = new DOMParser().parseFromString(String(html ?? ''), 'text/html'); // parsed, never run
      doc.querySelectorAll('br').forEach((n) => n.replaceWith('\n'));
      doc.querySelectorAll('li').forEach((li) => {
        const list = li.parentElement;
        li.prepend(list?.tagName === 'OL' ? `${[...list.children].indexOf(li) + 1}. ` : '• ');
      });
      doc.querySelectorAll('p, div, li, ul, ol').forEach((n) => n.append('\n'));
      return doc.body.textContent.replace(/\n{3,}/g, '\n\n').trim();
    }

    const isTaskEvent = (e) => e.gtype === 'task';

    const GoogleTasks = {
      LIST: '/lists/@default/tasks',
      call: (userId, path, options = {}) => GoogleCalendar.call(userId, path, { ...options, base: CONFIG.GOOGLE_TASKS_API }),

      /** What goes in a Google task's notes: the description as text, plus the meeting link. */
      notesFor(event) {
        const text = htmlToPlainText(event.description);
        return [text, event.link].filter(Boolean).join('\n\n').slice(0, 8000);
      },

      /** Taskly task -> the JSON Google Tasks expects. */
      toBody(event) {
        const done = Boolean(event.completed);
        return {
          title: event.title,
          notes: GoogleTasks.notesFor(event),
          due: `${event.date}T00:00:00.000Z`, // Google only uses the date part
          status: done ? 'completed' : 'needsAction',
          ...(done ? {} : { completed: null }),
        };
      },

      /** Google task -> the few fields we sync. `date` is null when the task has no due date. */
      fromTask(item) {
        return {
          gid: item.id,
          title: item.title || '',
          notes: item.notes ?? '',
          date: item.due ? String(item.due).slice(0, 10) : null,
          completed: item.status === 'completed',
          completedAt: item.completed ? Date.parse(item.completed) || Date.now() : null,
        };
      },
    };

    const taskFingerprint = (e) => JSON.stringify([e.gid, e.title, e.date, e.description ?? '', Boolean(e.completed)]);

    /**
     * Merge Google Tasks into Taskly's tasks. Same rules as reconcileGoogleEvents: unsent local edits win,
     * tasks deleted in Google disappear, and the SAME array comes back when nothing changed.
     * Times, guests, links and attachments are Taskly-only, so a merge keeps them.
     */
    function reconcileGoogleTasks(local, remote, { tombstones, defaultCalendarId }) {
      const byGid = new Map(local.filter((e) => e.gid).map((e) => [e.gid, e]));
      const matched = new Set();
      const result = [];
      let changed = false;

      remote.forEach((r) => {
        if (tombstones.has(`task:${r.gid}`)) return; // deleted here; Google will catch up
        const twin = byGid.get(r.gid);
        if (!r.date) { if (twin) { matched.add(twin.id); result.push(twin); } return; } // Taskly needs a date
        if (!twin) {
          result.push({
            id: createId(), gid: r.gid, gtype: 'task', onGoogle: true, dirty: false, rev: 1,
            title: r.title || '(No title)', date: r.date, start: 0, end: 24 * 60, allDay: true,
            description: descriptionToHtml(r.notes), calendarId: defaultCalendarId, guests: [], attachments: [], link: '',
            readOnly: false, htmlLink: '', gx: {}, completed: r.completed, completedAt: r.completedAt,
          });
          changed = true;
          return;
        }
        matched.add(twin.id);
        if (twin.dirty) { result.push(twin); return; }
        const notesChanged = r.notes !== GoogleTasks.notesFor(twin);
        const merged = {
          ...twin,
          title: r.title || twin.title,
          date: r.date,
          description: notesChanged ? descriptionToHtml(r.notes) : twin.description,
          completed: r.completed,
          completedAt: r.completed ? (twin.completed ? twin.completedAt : r.completedAt) : null,
        };
        if (taskFingerprint(merged) === taskFingerprint(twin)) { result.push(twin); return; }
        result.push(merged);
        changed = true;
      });

      local.forEach((e) => {
        if (matched.has(e.id)) return;
        if (e.onGoogle && !e.dirty) { changed = true; return; } // deleted in Google
        result.push(e);
      });
      return changed ? result : local;
    }

    /* ---------- Google Drive: picking files to attach ---------- */
    const DriveAttach = {
      tokens: new Map(), // userId -> { token, expiresAt }; memory only, like the Calendar tokens
      pickerLoading: null,

      /** The real picker needs a Google account, a Picker API key and Google's scripts. Otherwise the UI falls back to pasting a link. */
      available: (user) => Boolean(user) && Boolean(CONFIG.GOOGLE_PICKER_API_KEY) && Boolean(window.google?.accounts?.oauth2),

      /** Load Google's picker library once. */
      loadPicker() {
        this.pickerLoading ??= new Promise((resolve, reject) => {
          const ready = () => window.gapi.load('picker', { callback: resolve, onerror: () => reject(new Error('Could not load the Google Drive picker.')) });
          if (window.gapi?.load) return ready();
          const script = document.createElement('script');
          script.src = 'https://apis.google.com/js/api.js';
          script.async = true;
          script.onload = ready;
          script.onerror = () => reject(new Error('Could not load the Google Drive picker.'));
          document.head.append(script);
        }).catch((error) => { this.pickerLoading = null; throw error; });
        return this.pickerLoading;
      },

      /** A Drive token, asked for only when first needed (so nobody re-consents just to use the calendar). Call from a click. */
      token(user) {
        const cached = this.tokens.get(user.id);
        if (cached && cached.expiresAt - 60_000 > Date.now()) return Promise.resolve(cached.token);
        return new Promise((resolve, reject) => {
          if (!window.google?.accounts?.oauth2) return reject(new Error('Google sign-in has not finished loading. Try again in a moment.'));
          const client = google.accounts.oauth2.initTokenClient({
            client_id: CONFIG.GOOGLE_CLIENT_ID,
            scope: CONFIG.GOOGLE_DRIVE_SCOPE,
            hint: user.email,
            callback: (response) => {
              if (response.error || !google.accounts.oauth2.hasGrantedAllScopes(response, CONFIG.GOOGLE_DRIVE_SCOPE)) {
                return reject(new Error('Google Drive access was not granted.'));
              }
              this.tokens.set(user.id, { token: response.access_token, expiresAt: Date.now() + (Number(response.expires_in) || 3600) * 1000 });
              resolve(response.access_token);
            },
            error_callback: (err) => {
              const cancelled = err?.type === 'popup_closed';
              reject(Object.assign(new Error(cancelled ? 'Drive connection was cancelled.' : 'Google could not open its pop-up. Allow pop-ups and try again.'), { cancelled }));
            },
          });
          client.requestAccessToken({ prompt: '' });
        });
      },

      /** Open Google's picker. Resolves with the chosen files (an empty list if cancelled). */
      async pick(user) {
        // Both start immediately, inside the click, so the browser allows Google's pop-up.
        const [token] = await Promise.all([this.token(user), this.loadPicker()]);
        return new Promise((resolve) => {
          const { picker } = google;
          const builder = new picker.PickerBuilder()
            .setAppId(CONFIG.GOOGLE_CLIENT_ID.split('-')[0]) // the Cloud project number lets a drive.file token open the chosen files
            .setOAuthToken(token)
            .setDeveloperKey(CONFIG.GOOGLE_PICKER_API_KEY)
            .addView(new picker.DocsView(picker.ViewId.DOCS).setIncludeFolders(true))
            .addView(new picker.DocsUploadView())
            .enableFeature(picker.Feature.MULTISELECT_ENABLED)
            .setCallback((data) => {
              const action = data[picker.Response.ACTION];
              if (action === picker.Action.CANCEL) return resolve([]);
              if (action !== picker.Action.PICKED) return;
              resolve((data[picker.Response.DOCUMENTS] ?? []).map((doc) => ({
                fileId: doc[picker.Document.ID],
                fileUrl: doc[picker.Document.URL],
                title: doc[picker.Document.NAME],
                mimeType: doc[picker.Document.MIME_TYPE],
                iconLink: doc[picker.Document.ICON_URL],
              })));
            });
          builder.build().setVisible(true);
        });
      },
    };

    const googleUserOf = (state) => {
      const user = Selectors.activeUser(state);
      return GoogleCalendar.eligible(user) ? user : null;
    };

    /**
     * Deletes that Google has not confirmed yet. Remembering them stops a
     * schedule you deleted from coming back on the next pull, and lets a
     * failed delete be retried. Stored as { [userId]: [googleEventId] }.
     */
    const PendingDeletes = {
      KEY: 'taskly.google-deletes.v1',
      read() {
        try { return JSON.parse(localStorage.getItem(this.KEY)) ?? {}; } catch { return {}; }
      },
      write(all) {
        try { localStorage.setItem(this.KEY, JSON.stringify(all)); } catch { /* ignore */ }
      },
      forUser(userId) { return this.read()[userId] ?? []; },
      add(userId, gid) {
        const all = this.read();
        all[userId] = [...new Set([...(all[userId] ?? []), gid])];
        this.write(all);
      },
      remove(userId, gids) {
        if (!gids.length) return;
        const all = this.read();
        all[userId] = (all[userId] ?? []).filter((gid) => !gids.includes(gid));
        this.write(all);
      },
      clear(userId) {
        const all = this.read();
        delete all[userId];
        this.write(all);
      },
    };

    /** A comparable summary of a schedule, so unchanged events keep their identity (and don't re-render). */
    const fingerprint = (e) => JSON.stringify([
      e.gid, e.title, e.date, e.start, e.end, Boolean(e.allDay), e.description ?? '', e.calendarId,
      e.link ?? '', Boolean(e.readOnly), e.htmlLink ?? '', e.guests ?? [], e.attachments ?? [], e.gx ?? {},
    ]);

    /**
     * Merge what Google returned (`remote`) into Taskly's list (`local`).
     * Pure function: returns the SAME array when nothing changed.
     *   - new in Google                  -> added
     *   - changed in Google              -> updated (unless you have unsent edits)
     *   - gone from Google (in the window) -> removed
     *   - created/edited here, not sent yet -> left alone
     */
    function reconcileGoogleEvents(local, remote, { minKey, maxKey, tombstones }) {
      const inWindow = (e) => e.date >= minKey && e.date < maxKey;
      const byId = new Map(local.map((e) => [e.id, e]));
      const byGid = new Map(local.filter((e) => e.gid && !e.readOnly).map((e) => [e.gid, e]));
      const matched = new Set(); // ids of local events that Google also returned
      const result = [];
      let changed = false;

      remote.forEach((incoming) => {
        if (tombstones.has(incoming.gid)) return; // deleted here; Google will catch up
        // Events made in Taskly have a UUID id but share Google's id in `gid`.
        const twin = byId.get(incoming.id) ?? (incoming.readOnly ? undefined : byGid.get(incoming.gid));
        if (!twin) { result.push(incoming); changed = true; return; }

        matched.add(twin.id);
        if (twin.dirty) { result.push(twin); return; } // unsent local edits win
        const merged = { ...incoming, id: twin.id, completed: twin.completed, completedAt: twin.completedAt }; // "done" lives only here
        if (fingerprint(merged) === fingerprint(twin)) { result.push(twin); return; }
        result.push(merged);
        changed = true;
      });

      local.forEach((e) => {
        if (matched.has(e.id)) return;
        const deletedInGoogle = e.onGoogle && !e.dirty && inWindow(e);
        if (deletedInGoogle) { changed = true; return; }
        result.push(e);
      });

      return changed ? result : local;
    }

    /**
     * The sync engine: one instance per app. Everything that talks to Google
     * goes through a single queue, so requests never overlap or arrive out of
     * order (e.g. a delete can't overtake the create before it).
     */
    function createCalendarSync({ store, toast }) {
      const { getState, setState } = store;
      let chain = Promise.resolve();
      let running = false;
      let lastRunAt = 0;
      let covered = null;          // { userId, minKey, maxKey }: the date range the last pull loaded
      let coverageQueued = false;

      const enqueue = (task) => {
        const run = chain.then(task);
        chain = run.catch(() => {}); // a failed task must not block the queue
        return run;
      };
      const currentUser = () => googleUserOf(getState());
      const setStatus = (patch) => setState((s) => ({ gcal: { ...s.gcal, ...patch } }));
      const needsSending = (e) => !e.readOnly && (e.dirty || !e.onGoogle);

      /** Send one schedule to Google. Resolves with its Google id. */
      async function pushTask(userId, event) {
        const body = GoogleTasks.toBody(event);
        if (event.onGoogle && event.gid) {
          try {
            await GoogleTasks.call(userId, `${GoogleTasks.LIST}/${encodeURIComponent(event.gid)}`, { method: 'PATCH', body });
            return event.gid;
          } catch (error) { if (error.status !== 404) throw error; } // it was deleted in Google: create it again
        }
        const created = await GoogleTasks.call(userId, GoogleTasks.LIST, { method: 'POST', body });
        return created.id;
      }

      async function pushOne(userId, event) {
        if (isTaskEvent(event)) return pushTask(userId, event);
        const path = '/calendars/primary/events';
        const query = { sendUpdates: CONFIG.GOOGLE_SEND_INVITES, supportsAttachments: 'true' };
        const gid = event.gid ?? GoogleCalendar.idFor(event.id);
        const update = () => GoogleCalendar.call(userId, `${path}/${encodeURIComponent(gid)}`,
          { method: 'PATCH', query, body: GoogleCalendar.toBody(event, { patch: true }) });

        if (event.onGoogle && gid) {
          try { await update(); return gid; } catch (error) { if (error.status !== 404) throw error; }
        }
        try {
          const created = await GoogleCalendar.call(userId, path, {
            method: 'POST', query,
            body: { ...GoogleCalendar.toBody(event, { patch: false }), ...(gid ? { id: gid } : {}) },
          });
          return created?.id ?? gid;
        } catch (error) {
          if (error.status === 409 && gid) { await update(); return gid; } // it already exists: update it instead
          throw error;
        }
      }

      /** Record that Google now has the event (and that there is nothing left to send, unless it changed meanwhile). */
      function markSent(eventId, gid, rev) {
        setState((s) => {
          const target = s.events.find((e) => e.id === eventId);
          if (!target) return {};
          const untouched = target.rev === rev; // not edited again while the request was in flight
          const updated = { ...target, gid, onGoogle: true, ...(untouched ? { dirty: false } : {}) };
          return { events: s.events.map((e) => (e === target ? updated : e)) };
        });
      }

      async function pushPending(userId) {
        if (getState().activeUserId !== userId) return null;
        let failure = null;
        for (const event of getState().events.filter(needsSending)) {
          if (getState().activeUserId !== userId) return failure;
          try {
            markSent(event.id, await pushOne(userId, event), event.rev);
          } catch (error) {
            if (error.code === 'auth') throw error;
            failure = error; // keep going: one bad schedule shouldn't block the rest
          }
        }
        return failure;
      }

      async function flushDeletes(userId) {
        const done = [];
        for (const gid of PendingDeletes.forUser(userId)) {
          try {
            if (gid.startsWith('task:')) {
              await GoogleTasks.call(userId, `${GoogleTasks.LIST}/${encodeURIComponent(gid.slice(5))}`, { method: 'DELETE' });
            } else {
